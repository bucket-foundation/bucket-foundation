# grants-gateway — Kubernetes manifest for Hetzner K3s (agfarms-k3s cluster)
#
# Apply (from inside the K3s container):
#   kubectl apply -f deploy/k8s.yaml
#
# Or via the deploy.sh helper which mirrors enterprise-ai/scripts/deploy.sh:
#   ./deploy.sh --seed-secret    # first deploy
#   ./deploy.sh                  # subsequent deploys
#
# Prereqs:
#   - Ingress controller (Traefik default in K3s)
#   - cert-manager with ClusterIssuer "letsencrypt-prod"
#   - DNS: grants-gateway.nucleus.agfarms.dev → Hetzner CPX42 (5.161.236.151)
#     (sibling AGFarms ventures already use *.nucleus.agfarms.dev — cert path
#     is the well-trodden one. The task spec mentioned `grants.bucket.foundation`
#     as the long-term home; that flip is a DNS+cert-manager change only.)
#   - Image pushed to farmera/bucket-grants-gateway:<TAG> (corpus baked in)
#   - Secret `grants-env` with payment + LLM credentials
#
# Create the secret first (one time, see deploy.sh --seed-secret):
#   kubectl create namespace grants
#   kubectl -n grants create secret generic grants-env \
#     --from-literal=FEED402_WALLET=0xYOUR_BASE_WALLET \
#     --from-literal=FEED402_CHAIN=base \
#     --from-literal=FEED402_VERIFY_MODE=facilitator \
#     --from-literal=FEED402_FACILITATOR_URL=https://facilitator.x402.rs \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=INSIGHT_SYNTH=anthropic
#
# Rotate any secret value with:
#   kubectl -n grants patch secret grants-env -p \
#     "{\"stringData\":{\"ANTHROPIC_API_KEY\":\"sk-ant-NEW\"}}"
#   kubectl -n grants rollout restart deploy/grants-gateway

apiVersion: v1
kind: Namespace
metadata:
  name: grants
  labels:
    agfarms.dev/venture: bucket-foundation
    agfarms.dev/service: feed402-merchant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grants-gateway
  namespace: grants
  labels:
    app: grants-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grants-gateway
  template:
    metadata:
      labels:
        app: grants-gateway
    spec:
      containers:
        - name: server
          image: farmera/bucket-grants-gateway:v0.1.0-alpha.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8789
          env:
            - name: PORT
              value: "8789"
            - name: PROVIDER_DOMAIN
              value: "grants-gateway.nucleus.agfarms.dev"
            - name: NODE_ENV
              value: "production"
            - name: GRANTS_STORE
              value: "sqlite"
            - name: GRANTS_DB
              value: "/app/data/grants.db"
          envFrom:
            - secretRef:
                name: grants-env
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /.well-known/feed402.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: grants-gateway
  namespace: grants
spec:
  type: ClusterIP
  selector:
    app: grants-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grants-gateway
  namespace: grants
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grants-gateway.nucleus.agfarms.dev
      secretName: grants-gateway-nucleus-tls
  rules:
    - host: grants-gateway.nucleus.agfarms.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grants-gateway
                port:
                  number: 80
