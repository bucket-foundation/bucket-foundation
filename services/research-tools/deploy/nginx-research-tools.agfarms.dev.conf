# research-tools.agfarms.dev — host nginx vhost
# ==============================================
# Terminates TLS (Let's Encrypt via certbot) and proxies to the k3s Traefik
# NodePort (172.19.0.2:30080), forwarding the Host header so Traefik routes to
# the research-tools-gateway Ingress. Mirrors the bucket-foundation.nucleus
# tenant vhost pattern. NO basic-auth here: the gateway is a backend for the
# Bucket Next proxy; metering/identity lives in Bucket (doc §6), and the
# gateway is payment-agnostic and read/compute-only.
#
# Install on prod-hetzner-1:
#   sudo cp nginx-research-tools.agfarms.dev.conf \
#        /etc/nginx/sites-available/research-tools.agfarms.dev
#   sudo ln -sf /etc/nginx/sites-available/research-tools.agfarms.dev \
#        /etc/nginx/sites-enabled/research-tools.agfarms.dev
#   # issue cert (after DNS A record -> box IP exists; webroot or --nginx):
#   sudo certbot certonly --nginx -d research-tools.agfarms.dev
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name research-tools.agfarms.dev;
    # Allow ACME http-01 before redirecting everything else to https.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Legacy http2 syntax: this box's nginx predates the `http2 on;` directive
    # (added in nginx 1.25.1). Use the on-listen form to match the rest of the
    # vhosts on prod-hetzner-1.
    listen 443 ssl http2;
    server_name research-tools.agfarms.dev;

    ssl_certificate     /etc/letsencrypt/live/research-tools.agfarms.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/research-tools.agfarms.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Tool uploads (patchseqml/cryotriage multipart) — generous but bounded.
    client_max_body_size 50m;

    location / {
        # k3s Traefik NodePort; Host header drives the Ingress host-rule match.
        proxy_pass http://172.19.0.2:30080;
        proxy_http_version 1.1;
        proxy_set_header Host research-tools.agfarms.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tools can run up to ~5 min (proteinscout/screenserver/demo paths).
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
