<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advisor review</title>
<style>
:root{--bg:#EFE8D4;--panel:#E4DCC4;--line:rgba(31,28,22,.16);--ink:#1F1C16;--soft:#5E5543;--ochre:#8A641A;--ochre-fill:#B8861E;--teal:#0B6E6E;--rust:#9A3B22;--chip:#F6F1E3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1C16;--panel:#2A261E;--line:rgba(239,232,212,.16);--ink:#EFE8D4;--soft:#B9AF96;--ochre:#D9A43A;--ochre-fill:#D9A43A;--teal:#3FB6B6;--rust:#E07A5F;--chip:#2F2A21}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-width:0;padding:16px 16px 48px}
.stage{display:grid;gap:0;max-width:1600px;margin:0 auto}
h1{font:400 28px/1.15 Georgia,"Iowan Old Style",serif;margin:8px 0 4px}
h2{font:400 20px/1.2 Georgia,serif;margin:28px 0 8px}
.meta{color:var(--soft);font-size:13px;margin:0}
a{color:inherit;text-decoration-color:var(--ochre);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
details.method{border-top:1px solid var(--ink);margin-top:16px;padding-top:8px}
details.method summary{cursor:pointer;font-weight:600}
details.method img{width:100%;height:auto;border-radius:4px;margin-top:8px}
.method p{color:var(--soft);font-size:14px;margin:8px 0}
.spread{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}
.spread div{border-top:1px solid var(--line);padding-top:4px;font-size:13px}
.spread b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.bar{z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{max-width:100%;min-width:0;flex:1 1 150px;text-overflow:ellipsis}
.toggle{flex:1 1 220px;min-width:0}
.toggle span{overflow-wrap:anywhere}
select,input,button{font:inherit;font-size:14px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input[type=search]{flex:1 1 200px;min-width:0}
button{cursor:pointer}
.tabs select{flex:0 1 auto;max-width:260px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--soft);font-size:13px}
.cards{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px;align-items:start}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel);display:grid;gap:8px;align-content:start}
.card[data-status=shortlist]{border-color:var(--ochre-fill);box-shadow:inset 4px 0 0 var(--ochre-fill)}
.card[data-status=maybe]{box-shadow:inset 4px 0 0 var(--soft)}
.card[data-status=skip]{opacity:.55}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.name{font:400 19px/1.25 Georgia,serif;margin:0}
.rank{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px;white-space:nowrap;text-align:right}
.rank b{display:block;font-size:17px;color:var(--ink)}
.where{color:var(--soft);font-size:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--soft)}
.flag{color:var(--rust);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1 1 90px}
.actions button[data-set=shortlist]{border-color:var(--ochre-fill);color:var(--ochre)}
.actions button[data-set=skip]{color:var(--rust);border-color:color-mix(in srgb,var(--rust) 45%,transparent);background:transparent}
.actions button[data-set=maybe]{flex:0 0 38px;padding:6px 0;display:grid;place-items:center;color:var(--soft);background:transparent}
.actions button[data-set=maybe] svg{width:14px;height:14px}
.actions button[aria-pressed=true][data-set=shortlist]{background:var(--ochre-fill);color:#1F1C16;border-color:var(--ochre-fill)}
.actions button[aria-pressed=true][data-set=maybe]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions button[aria-pressed=true][data-set=skip]{background:var(--rust);color:#fff;border-color:var(--rust)}
.empty{color:var(--soft);padding:24px 0;text-align:center}
.toggle{display:flex;gap:6px;align-items:center;font-size:14px}
.more-filters summary{cursor:pointer;font-size:14px;color:var(--soft);padding:2px 0}
.more-filters .row{margin-top:8px}

.toggle input{width:18px;height:18px;accent-color:var(--ochre-fill)}
.more-wrap{text-align:center;margin:16px 0}
@media (min-width:760px){main{padding:24px 32px 96px}.cards{grid-template-columns:1fr 1fr}}
.layout{display:grid;gap:16px;align-items:start}
.layout>div{min-width:0}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px;display:grid;gap:10px;min-width:0;align-content:start}
.panel h2{margin:0}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.panel dt{color:var(--soft)}
.panel dd{margin:0;overflow-wrap:anywhere}
.stars{display:grid;gap:8px}
.stars figure{margin:0}
.stars figcaption{font-size:12px;color:var(--soft)}
.radar{width:100%;height:auto;display:block}
.radar text{fill:var(--soft);font-size:9px}
.timeline input[type=range]{flex:1 1 200px;min-width:0;accent-color:var(--ochre-fill)}
.dirs button[aria-pressed=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
.card.selected{outline:2px solid var(--ochre-fill);outline-offset:1px}
.card{cursor:pointer}
.note{font-size:12px;color:var(--soft);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pill{border-radius:999px;padding:10px 18px;font-size:15px}
.circle-wrap{position:relative;margin:12px auto 0;width:100%}
#circle{display:block;cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;margin:0;white-space:nowrap}
.legend{display:grid;gap:2px;font-size:12px;color:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--chip);margin-top:8px;max-width:260px}
.legend b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre)}
.timeline{border-top:1px solid var(--line);margin-top:16px;padding-top:10px;display:grid;gap:6px}
.tl-now{margin:0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.tl-now b{font:400 24px/1.2 Georgia,serif;color:var(--ochre)}
.tl-foot{margin:0;text-align:center;letter-spacing:.06em}
body:not(.circle) .circle-wrap{display:none}
body.circle .cards,body.circle .more-wrap{display:none}
.panel{border-width:0 0 0 1px;border-radius:0}
.main-radar svg{width:100%;height:auto;display:block}
.main-radar text{font-size:8px}
.legend.static{position:static;margin:8px auto 0}
.key{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle;border-radius:50%}
.key.you{background:var(--ochre-fill)}
.key.avg{background:var(--soft);border-radius:0;transform:rotate(45deg) scale(.8)}
.key.sel{border:2px solid var(--ink)}
.key.short{border:2px solid var(--ochre-fill);background:transparent}
.legend em{font-style:normal;font-size:11px;color:var(--soft)}
.legend span{display:flex;align-items:center;gap:0;overflow-wrap:anywhere}
.swatch{width:22px;height:10px;margin-right:6px;flex:none}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.minis button{padding:4px;display:grid;gap:2px;font-size:11px;color:var(--soft);background:var(--bg)}
.minis button[aria-pressed=true]{border-color:var(--ochre-fill);box-shadow:inset 0 0 0 1px var(--ochre-fill)}
.minis canvas,.minis svg{width:100%;aspect-ratio:1/1;height:auto;display:block}
.minis svg text{display:none}
.side{min-width:0;background:var(--panel);display:grid;gap:12px;align-content:start;padding:14px}
.side details.method{margin:0 0 8px}
.head{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.head h1{margin:0;font-size:24px}
.dirs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.dirs button{white-space:nowrap;flex:none}
.dirs .count{flex:none;white-space:nowrap}
#odirs button[aria-pressed=true]{background:var(--ochre-fill);color:#1F1C16;border-color:var(--ochre-fill)}
.chart-box{position:relative;margin:0 auto}
.chart-box #circle,.chart-box .main-radar{width:100%;height:100%}
.main-radar svg{width:100%;height:100%;overflow:visible}
.main-radar{overflow:visible}
@media (min-width:900px) and (min-height:560px){
html,body{height:100%;overflow:hidden}
.stage{grid-template-columns:minmax(0,1fr) 400px;height:100vh;max-width:none}
main{display:flex;flex-direction:column;height:100vh;overflow:hidden;padding:12px 24px 10px}
.bar{padding:8px 0;gap:6px}
.circle-wrap{flex:1 1 auto;min-height:0;width:100%;max-width:none;margin:6px 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bar{flex:0 1 auto;min-height:0;overflow:auto}
.timeline{flex:none}
.cards{flex:1 1 auto;min-height:0;overflow:auto}
.more-wrap{margin:6px 0}
.timeline{margin-top:6px;padding-top:6px;gap:4px}
.tl-now b{font-size:20px}
.side{height:100vh;overflow:auto;padding:20px}
.legend,.legend.static{position:absolute;left:0;top:0;margin:0;max-width:220px}
.head .meta{font-size:12px}
.main-radar text{font-size:5.5px}
.more-filters[open]{max-height:30vh;overflow:auto}
}
@media (max-width:1099px){.panel{border-width:1px 0 0 0}}
</style>
</head>
<body class="circle">
<div class="stage">
<main>
<header class="head"><h1>Advisor review</h1><p class="meta" id="summary"></p><p class="meta">Private review. Stored in this browser only.</p></header>

<div class="bar">
<div class="row"><input type="search" id="q" class="pill" placeholder="Search name, institution, topic" aria-label="Search"></div>
<div class="row dirs" id="dirs" role="group" aria-label="Prime directions: keep advisors at or above the 75th percentile"></div>
<div class="row dirs" id="odirs" role="group" aria-label="Our directions: keep advisors at or above the 75th percentile"></div>
<div class="row tabs" role="group" aria-label="View">
<button type="button" data-view="circle" aria-pressed="true">Expanded</button>
<button type="button" data-view="list" aria-pressed="false">List</button>
<select id="sort" aria-label="Sort"></select>
<select id="f-h" aria-label="Minimum h-index"><option value="">Any h-index</option><option value="10">h-index 10+</option><option value="25">h-index 25+</option><option value="50">h-index 50+</option></select>
<span class="count" id="count"></span>
</div>
<details class="more-filters"><summary>Filters and export</summary>
<div class="row">
<select id="view" aria-label="Who"><option value="phd">PhD advisors</option><option value="stevens">Stevens contacts</option><option value="all">Everyone</option></select>
<select id="f-status" aria-label="Decision"><option value="">All decisions</option><option value="none">Undecided</option><option value="shortlist">Shortlist</option><option value="maybe">Saved for later</option><option value="skip">Skip</option></select>
<label class="toggle"><input type="checkbox" id="cap" checked> <span id="cap-label"></span></label>
<label class="toggle"><input type="checkbox" id="keys" checked> <span>Single-key shortcuts on the chart and panel</span></label>
<button type="button" id="export">Export shortlist CSV</button>
</div>
<div class="row" id="filters"></div>
</details>
</div>

<section class="circle-wrap" id="circle-wrap">
<div class="chart-box" id="chart-box">
<canvas id="circle" role="img" aria-label="Every advisor on a circle around the research statement"></canvas>
<div id="main-radar" class="main-radar" tabindex="0" hidden></div>
</div>
<p class="tip" id="tip" hidden></p>
<div class="legend" id="legend" aria-label="Chart legend"></div>
</section>

<ol class="cards" id="cards"></ol>
<p class="more-wrap"><button type="button" id="more">Show more</button></p>

<div class="timeline">
<p class="tl-now"><b id="tl-name"></b><span id="tl-pos"></span></p>
<div class="row"><button type="button" id="prev" aria-label="Previous advisor">Previous</button><input type="range" id="tl" min="0" max="0" value="0" aria-label="Step through advisors in the current order"><button type="button" id="next" aria-label="Next advisor">Next</button><button type="button" id="play" aria-pressed="false">Play</button></div>
<p class="count tl-foot">Scroll over the chart or drag to step through advisors in the current sort order.</p>
</div>


</main>
<aside class="side"><div class="panel" id="panel" aria-label="Selected advisor"></div>
<details class="method">
<summary>How the ranking works</summary>
<p id="method-text"></p>
<div class="spread" id="spread"></div>
<p id="plot-text"></p>
<img src="__IMAGE__" alt="Every professor as a dot on the two components where the statement scores highest; the statement is a star and the top matches are numbered">
</details>
</aside>
</div>
<p class="sr" id="announce" aria-live="polite"></p>
<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
const payload = JSON.parse(document.getElementById("data").textContent);
const rows = payload.rows, ctx = payload.context;
const KEY = "advisor-review:" + (ctx.key || "v1");
const FILTERS = [["field","All fields"],["country","All countries"],["funding","All funding"],["institution","All institutions"],["taking_students","Taking students: any"],["identity","All profile checks"]];
const PAGE_SIZE = 60;
let limit = PAGE_SIZE;
const CAP = ctx.cap || 5, WINDOW = ctx.cap_window || 50;
const inSource = (r, s) => String(r.sources || "").split(";").map((x) => x.trim()).includes(s);
const VIEWS = {phd: (r) => !inSource(r, "stevens"), stevens: (r) => inSource(r, "stevens"), all: () => true};
function diversify(list) {
  const picked = [], held = [], counts = {};
  for (const r of list) {
    const inst = r.institution || "";
    if (picked.length < WINDOW && inst && (counts[inst] || 0) >= CAP) { held.push(r); continue; }
    counts[inst] = (counts[inst] || 0) + 1;
    picked.push(r);
    if (picked.length === WINDOW) { picked.push(...held); held.length = 0; }
  }
  return picked.concat(held);
}
let decisions = {};
try { decisions = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { decisions = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(decisions)); } catch (e) {} };
const $ = (id) => document.getElementById(id);
const make = (tag, props = {}, kids = []) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === "text") n.textContent = v; else if (k === "dataset") Object.assign(n.dataset, v); else n.setAttribute(k, v); } for (const c of kids) if (c) n.append(c); return n; };
const fmt = (x, d = 2) => Number(x).toFixed(d);

$("summary").textContent = ctx.summary;
$("method-text").textContent = ctx.method;
$("plot-text").textContent = ctx.plot;
const spread = $("spread");
for (const [label, key] of [["Best score","top1"],["10th","top10"],["100th","top100"],["300th","top300"],["Median","median"]]) spread.append(make("div", {}, [make("b", {text: fmt(ctx.spread[key], 3)}), document.createTextNode(label)]));

const present = FILTERS.filter(([k]) => rows.some((r) => r[k] !== "" && r[k] != null));
for (const [k, label] of present) {
  const sel = make("select", {id: "f-" + k, "aria-label": label});
  sel.append(make("option", {value: "", text: label}));
  const counts = {};
  for (const r of rows) { const v = String(r[k] ?? ""); if (v) counts[v] = (counts[v] || 0) + 1; }
  for (const v of Object.keys(counts).sort()) sel.append(make("option", {value: v, text: v + " (" + counts[v] + ")"}));
  $("filters").append(sel);
}

const statusOf = (r) => decisions[r.id] || "none";
const safeUrl = (u) => (typeof u === "string" && /^https:\/\/[^\s]+$/i.test(u.trim()) ? u.trim() : "");
const contactOf = (r) => (r.email && r.email_public === true ? {kind: "email", value: r.email} : safeUrl(r.profile_url) ? {kind: "profile", value: safeUrl(r.profile_url)} : null);
const AXES = ctx.prime_axes || [], OURS = ctx.our_axes || [];
const dirOn = new Set();
AXES.forEach((label, k) => {
  const b = make("button", {type: "button", "aria-pressed": "false", title: "Direction " + (k + 1) + ": " + label, text: label});
  b.addEventListener("click", () => { if (dirOn.has(k)) dirOn.delete(k); else dirOn.add(k); b.setAttribute("aria-pressed", String(dirOn.has(k))); reset(); });
  $("dirs").append(b);
});
if (AXES.length) $("dirs").prepend(make("span", {class: "count", text: "Prime directions"}));
if (!AXES.length) $("dirs").hidden = true;
const num = (v) => (v === "" || v == null || isNaN(Number(v)) ? -Infinity : Number(v));
const SORTS = {
  rank: (a, b) => a.rank - b.rank,
  h: (a, b) => num(b.h_index) - num(a.h_index) || a.rank - b.rank,
  name: (a, b) => String(a.name).localeCompare(String(b.name)),
  institution: (a, b) => String(a.institution || "~").localeCompare(String(b.institution || "~")) || a.rank - b.rank,
  funded: (a, b) => (String(b.funding).includes("active") ? 1 : 0) - (String(a.funding).includes("active") ? 1 : 0) || a.rank - b.rank,
  saved: (a, b) => ({shortlist: 0, maybe: 1, none: 2, skip: 3}[statusOf(a)] - {shortlist: 0, maybe: 1, none: 2, skip: 3}[statusOf(b)]) || a.rank - b.rank,
};
OURS.forEach((l, k) => { SORTS["ours" + k] = (a, b) => ((b.star_ours || [])[k] ?? -1) - ((a.star_ours || [])[k] ?? -1) || a.rank - b.rank; });
AXES.forEach((l, k) => { SORTS["prime" + k] = (a, b) => ((b.star_prime || [])[k] ?? -1) - ((a.star_prime || [])[k] ?? -1) || a.rank - b.rank; });
const sortOpts = [["rank", "Sort: best match"], ["h", "Sort: h-index"], ["funded", "Sort: active grant first"], ["saved", "Sort: my decisions"], ["institution", "Sort: institution"], ["name", "Sort: name"]]
  .concat(OURS.map((l, k) => ["ours" + k, "Sort: closest to " + l]))
  .concat(AXES.map((l, k) => ["prime" + k, "Sort: highest on " + l]));
for (const [v, t] of sortOpts) $("sort").append(make("option", {value: v, text: t}));
const oursOn = new Set();
if (OURS.length) $("odirs").append(make("span", {class: "count", text: "Our directions"}));
OURS.forEach((label, k) => {
  const b = make("button", {type: "button", "aria-pressed": "false", title: "Keep advisors in the top quarter on " + label, text: label});
  b.addEventListener("click", () => { if (oursOn.has(k)) oursOn.delete(k); else oursOn.add(k); b.setAttribute("aria-pressed", String(oursOn.has(k))); reset(); });
  $("odirs").append(b);
});
if (!OURS.length) $("odirs").hidden = true;
if (!rows.some((r) => r.h_index !== "" && r.h_index != null)) $("f-h").hidden = true;
let selectedId = null, current = [];
const SVGNS = "http://www.w3.org/2000/svg";
const svg = (tag, attrs) => { const n = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
function smoothLoop(p, t = 0.35) {
  const n = p.length, at = (i) => p[(i + n) % n];
  let d = "M" + p[0][0].toFixed(2) + "," + p[0][1].toFixed(2);
  for (let i = 0; i < n; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) * t / 2, p1[1] + (p2[1] - p0[1]) * t / 2];
    const c2 = [p2[0] - (p3[0] - p1[0]) * t / 2, p2[1] - (p3[1] - p1[1]) * t / 2];
    d += " C" + c1.map((v) => v.toFixed(2)).join(",") + " " + c2.map((v) => v.toFixed(2)).join(",") + " " + p2[0].toFixed(2) + "," + p2[1].toFixed(2);
  }
  return d + " Z";
}
const topScale = (v) => (v == null ? v : Math.max(0, 1 - Math.log10(1 + 99 * (1 - Math.min(1, Math.max(0, v)))) / 2));
function radar(labels, series, compact = false, square = false, rings = null) {
  const W = 380, C = 190, R = 84, k = labels.length;
  const root = svg("svg", {preserveAspectRatio: "xMidYMid meet", viewBox: compact || square ? (C - R - 4) + " " + (C - R - 4) + " " + (2 * R + 8) + " " + (2 * R + 8) : "0 " + (C - R - 30) + " " + W + " " + (2 * R + 60), class: "radar", role: "img"});
  const ang = (i) => -Math.PI / 2 + 2 * Math.PI * i / k;
  for (const [f, name] of rings || [[0.25], [0.5], [0.75], [1]]) {
    root.append(svg("circle", {cx: C, cy: C, r: R * f, fill: "none", stroke: "currentColor", "stroke-opacity": "0.15"}));
    if (name && !compact) { const t = svg("text", {x: C + 2, y: C - R * f - 2, "font-size": "4.5", "fill-opacity": "0.7"}); t.textContent = name; root.append(t); }
  }

  if (!list.length) ol.append(make("li", {class: "empty", text: "No one matches these filters."}));
  current = list;
  if (!list.some((r) => r.id === selectedId)) selectedId = list.length ? list[0].id : null;
  document.querySelectorAll(".cards .card").forEach((el) => el.classList.toggle("selected", el.dataset.id === selectedId));
  const idx = list.findIndex((r) => r.id === selectedId);
  $("tl").max = String(Math.max(list.length - 1, 0));
  $("tl").value = String(Math.max(idx, 0));
  $("tl-pos").textContent = list.length ? (idx + 1) + " of " + list.length : "";
  $("tl").setAttribute("aria-valuetext", list.length && idx >= 0 ? (idx + 1) + " of " + list.length + ": " + list[idx].name : "none");
  const said = list[idx] ? list[idx].name + ", rank " + list[idx].rank : "";
  if ($("announce").textContent !== said) $("announce").textContent = said;
  $("prev").disabled = idx <= 0; $("next").disabled = idx < 0 || idx >= list.length - 1;
  panel(list[idx]);
  $("tl-name").textContent = list[idx] ? "#" + list[idx].rank + " " + list[idx].name : "No one matches";
  drawMain();
}

document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("[data-view]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  document.body.classList.toggle("circle", b.dataset.view === "circle");
  drawMain();
}));
$("tl").addEventListener("input", () => { const r = current[Number($("tl").value)]; if (r) select(r.id); });
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
document.addEventListener("keydown", (e) => {
  if (e.target !== document.body && !e.target.classList.contains("card") && e.target.id !== "circle") return;
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
});
if (window.matchMedia("(min-width: 760px)").matches && !window.matchMedia("(min-width: 900px) and (min-height: 560px)").matches) document.querySelector(".more-filters").open = true;
$("cap-label").textContent = "At most " + CAP + " per institution in the top " + WINDOW;
const reset = () => { limit = PAGE_SIZE; render(); };
$("more").addEventListener("click", () => { limit += PAGE_SIZE; render(); });
$("view").addEventListener("change", reset);
$("cap").addEventListener("change", reset);
$("q").addEventListener("input", reset);
$("f-status").addEventListener("change", reset);
$("sort").addEventListener("change", () => { selectedId = null; reset(); });
$("f-h").addEventListener("change", reset);
for (const [k] of present) $("f-" + k).addEventListener("change", reset);

const csvCell = (v) => { let s = Array.isArray(v) ? v.join("; ") : String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
$("export").addEventListener("click", () => {
  const cols = ["decision","rank","name","institution","department","country","field","funding","email","score","percentile","shared_topics"];
  const picked = rows.filter((r) => ["shortlist","maybe"].includes(statusOf(r))).sort((a, b) => (statusOf(a) === "shortlist" ? 0 : 1) - (statusOf(b) === "shortlist" ? 0 : 1) || a.rank - b.rank);
  const lines = [cols.join(",")].concat(picked.map((r) => cols.map((c) => csvCell(c === "decision" ? statusOf(r) : r[c])).join(",")));
  const blob = new Blob([lines.join("\n") + "\n"], {type: "text/csv"});
  const a = make("a", {href: URL.createObjectURL(blob), download: "advisor-shortlist.csv"});
  document.body.append(a); a.click(); a.remove();
});
render();
window.__advisorReview = {safeUrl, contactOf, step, select, visible, selected: () => selectedId, statusOf: (id) => statusOf(rows.find((x) => x.id === id) || {}), toggleDirection: (k) => $("dirs").children[k].click(), main: () => MAIN, setMain};
})();
</script>
</body>
</html>
