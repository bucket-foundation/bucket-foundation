[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hte"
version = "0.1.0"
description = "History Hypothesis Engine core: address space, subjective-logic belief, and their supporting timeline, concept, and evidence models."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["hte", "hte.*"]

[tool.setuptools.package-data]
hte = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
