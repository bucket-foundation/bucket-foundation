[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hte"
version = "0.1.0"
description = "History Hypothesis Engine: address space, subjective-logic belief, generation, tournament, calibration, and the LLM-backed engine loop."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hte = "hte.cli:main"
hte-pipeline = "hte.cli_pipeline:main"
hte-synth = "hte.cli_synth:main"
hte-serve = "hte.serve:main"

[tool.setuptools.packages.find]
include = ["hte", "hte.*"]

[tool.setuptools.package-data]
hte = ["data/*.json", "data/retrieval-fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: measured to exceed 2s under the `fast` hypothesis profile (excluded by `make test`'s `-m \"not slow\"`; see tests/conftest.py)",
]
