[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bucket-eval"
version = "0.1.0"
description = "Shared evaluation harness for the Bucket research program: datasets, candidates, metrics, controls and locked runs."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyarrow>=15", "pyyaml>=6"]

[project.scripts]
bucket-eval = "bucket_eval.cli:main"

[tool.setuptools.packages.find]
include = ["bucket_eval", "bucket_eval.*"]

[tool.setuptools.package-data]
bucket_eval = ["datasets/manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
