[workspace]
resolver = "2"
members = ["rank", "rank-wasm", "s1-two-writers", "s2-ranking-parity", "s4-native-engine", "s6-sealed-reader"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.small]
inherits = "release"
opt-level = "z"

[profile.parity]
inherits = "release"
panic = "unwind"
