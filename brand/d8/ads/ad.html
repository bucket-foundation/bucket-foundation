<style>
*{box-sizing:border-box;margin:0}
html,body{margin:0;background:#F6EEDC;overflow:hidden}
.ad{position:relative;width:1080px;height:var(--H);background:#F6EEDC;background-image:radial-gradient(#e2d4b4 1.6px,transparent 1.7px);background-size:34px 34px;font-family:Nunito,sans-serif;color:#231F20;overflow:hidden;display:flex;flex-direction:column;padding:64px 72px 0}
.top{display:flex;align-items:center;gap:16px}.top img{width:72px;height:72px;border-radius:18px}.top b{font-family:Fredoka;font-size:46px;color:#3A0F2F}

.mid{display:flex;align-items:center;gap:28px;margin-top:var(--g)}
.pot{display:flex;align-items:center;gap:12px}.pot .fire{width:auto;height:170px;overflow:visible}.pot b{display:block;font-family:Fredoka;font-size:72px;line-height:1;color:#D9381E}.pot span{font-family:'Space Mono';font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:#5d5650}
.grid{display:grid;grid-template-columns:repeat(3,var(--T));gap:22px;margin-top:var(--g);justify-content:center}
.grid .t{width:100%;height:auto;aspect-ratio:1}.grid .tt b{font-size:calc(var(--T)*.21)}.grid .tt b.long{font-size:calc(var(--T)*.15)}.grid .tt .cc{font-size:17px;left:26px;top:24px}.grid .tt i{font-size:22px;bottom:26px}.grid .tt::before{inset:16px}.grid .tt .snd svg{width:28px;height:28px}
.cta{margin-top:var(--g);background:#D9381E;color:#fff;font-weight:800;font-size:40px;text-align:center;padding:30px;border-radius:16px;box-shadow:0 6px 0 #8E2312}
.sub{font-family:'Space Mono';font-weight:700;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:#5d5650;text-align:center;margin-top:20px}
.art{overflow:hidden;position:relative;flex:1;min-height:0;margin:var(--g) -72px 0;background:#5B1A4A;clip-path:polygon(0 18%,100% 0,100% 100%,0 100%)}.art>*{position:absolute}
.mini{font-weight:800;font-size:54px;color:#F6EEDC;opacity:.75}

.kente{width:300px;height:90px;box-shadow:0 8px 0 rgba(0,0,0,.35);background:repeating-linear-gradient(90deg,#E9A23B 0 22px,#1E7A5A 0 30px,#E9A23B 0 52px,#D9381E 0 60px,#231F20 0 66px),#E9A23B;background-blend-mode:normal}
.kente::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 26px,rgba(35,31,32,.85) 0 32px)}
.seal{width:150px;height:150px;background:#D9381E;border-radius:10px;display:grid;place-items:center;box-shadow:inset 0 0 0 8px #D9381E,inset 0 0 0 12px #F6EEDC,0 6px 0 rgba(0,0,0,.35)}
.seal span{font-family:'Noto Sans SC';font-weight:800;font-size:96px;color:#F6EEDC}
.stamp{background:#F6EEDC;padding:18px 22px;outline:8px dotted #F6EEDC;outline-offset:-2px;box-shadow:0 8px 0 rgba(0,0,0,.35);color:#231F20}
.stamp b{display:block;font-size:44px}
.stamp small{font-family:'Space Mono';font-size:12px;letter-spacing:.12em;color:#7a6f63}
.torn{background:#EBDDBE;padding:16px 34px;clip-path:polygon(0 8%,6% 0,14% 6%,24% 1%,36% 7%,50% 0,63% 6%,77% 1%,88% 7%,100% 2%,98% 92%,88% 100%,74% 94%,60% 100%,46% 93%,32% 100%,18% 94%,6% 100%,1% 90%)}
.torn span{font-size:56px;font-weight:800;color:#5B1A4A}
.paisley{width:110px;height:150px;background:#D9381E;border-radius:60% 40% 60% 40%/70% 70% 30% 30%;box-shadow:inset 0 0 0 10px #E9A23B,inset 0 0 0 16px #D9381E,inset 0 0 0 20px #F6EEDC}
.fl{transform-origin:50px 18px;transform-box:view-box}
.one{transform-origin:50px 80px;animation:flk 1.1s ease-in-out infinite alternate}
.core{transform-origin:50px 80px;transform-box:view-box;animation:flk .7s ease-in-out infinite alternate-reverse}
.f2{animation:flk 0.8s ease-in-out infinite alternate-reverse}
.f3{animation:flk 0.6s ease-in-out infinite alternate}
@keyframes flk{0%{transform:scale(1,1) skewX(0)}35%{transform:scale(.94,1.08) skewX(-4deg)}70%{transform:scale(1.05,.95) skewX(3deg)}100%{transform:scale(.97,1.1) skewX(-2deg)}}

</style></head><body>

<script>
