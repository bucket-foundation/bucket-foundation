<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bkt Primitive hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&family=Space+Mono:wght@400;700&family=Heebo:wght@500;700&display=block">
<style>:root{--bg:#D9D6CF;--surf:#EDEBE6;--text:#111111;--muted:#3F3D39;--acc:#FF5F00;--onacc:#111111;--hl:#1D4ED8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 16px/24px 'Jost';font-optical-sizing:auto;-webkit-font-smoothing:antialiased}

.btn{background:var(--acc);color:var(--onacc);border:0;font:600 16px/1 'Jost';padding:var(--s4) var(--s5);min-height:48px;cursor:pointer}.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--text)!important}
.study{padding:var(--s7) var(--s6)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4)}.c{background:var(--surf);padding:var(--s6);display:flex;flex-direction:column;gap:var(--s2)}.c p{margin:0}.tag{font-size:13px;font-weight:600;align-self:flex-start}.word{font:700 48px/56px 'Jost'}.tag{line-height:16px}.c p{line-height:24px}.muted{color:var(--muted)}.he,.he .word{font-family:'Heebo'}.he .tag{align-self:flex-start}.actions{display:flex;gap:var(--s4);justify-content:flex-end;align-items:center;margin-top:var(--s6)}.prog{flex:1;height:8px;background:color-mix(in srgb,var(--muted) 25%,transparent)}.prog i{display:block;height:100%;background:var(--acc)}
