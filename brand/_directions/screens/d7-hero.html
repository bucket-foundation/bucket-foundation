<style>:root{--bg:#F3EEE3;--surf:#FBF8F1;--text:#1A1714;--muted:#5B5148;--acc:#A6442A;--onacc:#FFFFFF;--hl:#1E4F94}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 16px/24px 'Gentium Book Plus';font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
