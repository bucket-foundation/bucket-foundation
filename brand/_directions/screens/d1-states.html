<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bkt Grid hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Mono&family=IBM+Plex+Sans+Hebrew:wght@400;600&display=block">
<style>:root{--bg:#FFFFFF;--surf:#F4F4F4;--text:#161616;--muted:#525252;--acc:#0F62FE;--onacc:#FFFFFF;--hl:#DA1E28}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 16px/24px 'IBM Plex Sans';font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
header{display:flex;justify-content:space-between;align-items:center;padding:var(--s4) var(--s6)}.logo{display:flex;gap:var(--s2);align-items:center;font:300 22px 'IBM Plex Sans'}nav{display:flex;gap:var(--s5)}nav a{color:var(--text)}
h1{font:300 76px/1.1 'IBM Plex Sans';letter-spacing:-0.02em;margin:0 0 var(--s5)}.kicker{color:var(--muted);margin:0 0 var(--s4);font-size:14px}.sub{color:var(--muted);font-size:18px;line-height:28px;max-width:44ch;margin:0 0 var(--s6)}img{width:100%;display:block}.cons svg{width:100%;height:auto;display:block}img[hidden]{display:none}
.btn{background:var(--acc);color:var(--onacc);border:0;font:600 16px/1 'IBM Plex Sans';padding:var(--s4) var(--s5);min-height:48px;cursor:pointer}.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--text)!important}
.study{padding:var(--s7) var(--s6)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4)}.c{background:var(--surf);padding:var(--s6);display:flex;flex-direction:column;gap:var(--s2)}.c p{margin:0}.tag{font-size:13px;font-weight:600;align-self:flex-start}.word{font:300 48px/56px 'IBM Plex Sans'}.tag{line-height:16px}.c p{line-height:24px}.muted{color:var(--muted)}.he,.he .word{font-family:'IBM Plex Sans Hebrew'}.he .tag{align-self:flex-start}.actions{display:flex;gap:var(--s4);justify-content:flex-end;align-items:center;margin-top:var(--s6)}.prog{flex:1;height:8px;background:color-mix(in srgb,var(--muted) 25%,transparent)}.prog i{display:block;height:100%;background:var(--acc)}
body{min-height:100vh;display:flex;flex-direction:column}main,.hero{flex:1}.tree{margin-top:var(--s6)}.tree h2{font:300 20px 'IBM Plex Sans';margin:0 0 var(--s3)}.tree ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s3)}.tree li{border-top:2px solid var(--text);padding-top:var(--s2);display:flex;flex-direction:column}.tree b{font-size:20px}.tree span{color:var(--muted);font-size:14px}footer{padding:var(--s4) var(--s6);color:var(--muted);font-size:14px;border-top:1px solid color-mix(in srgb,var(--muted) 30%,transparent)}
header{border-bottom:1px solid #E0E0E0}.hero{display:grid;grid-template-columns:repeat(16,1fr);gap:0 var(--s6);padding:var(--s9) var(--s6)}.hero .txt{grid-column:1/8}.hero figure{grid-column:9/17;margin:0}.hero figure svg{width:100%;height:auto;display:block}.hero img{aspect-ratio:1;object-fit:cover}.kicker{font-family:'IBM Plex Mono';font-size:14px;letter-spacing:.32px}
.btn{border-radius:0;padding:var(--s4) var(--s8) var(--s4) var(--s4)}.cards{grid-template-columns:repeat(4,1fr);gap:1px;background:#E0E0E0}.c{border-radius:0}.root{border-top:4px solid var(--acc)}.inp{font:400 16px/24px inherit;font-family:inherit;color:var(--text);background:var(--surf);border:1px solid var(--muted);padding:var(--s3) var(--s4);min-height:48px;width:220px;border-radius:inherit}.inp:focus-visible,.inp.is-focus{outline:3px solid var(--acc);outline-offset:2px}.inp:disabled,.inp.is-disabled{background:var(--bg);border-style:dashed;cursor:not-allowed}.btn{transition:background-color 120ms var(--ease),transform 80ms var(--ease),box-shadow 120ms}.btn:hover,.btn.is-hover{background:color-mix(in srgb,var(--acc) 86%,#000)}.btn:active,.btn.is-active{transform:translateY(1px)}.btn:focus-visible,.btn.is-focus{outline:3px solid var(--text);outline-offset:3px}.btn:disabled,.btn.is-disabled{background:var(--surf);color:var(--muted);box-shadow:inset 0 0 0 1px var(--muted);cursor:not-allowed;transform:none}.btn.ghost:hover,.btn.ghost.is-hover{background:color-mix(in srgb,var(--text) 10%,transparent)}:root{--ease:cubic-bezier(0.2,0,0.38,0.9);--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--s9:96px}
@media (max-width:600px){header{padding:var(--s3) var(--s4)}nav{display:none}.hero{display:flex!important;flex-direction:column;padding:var(--s6) var(--s4)!important;gap:var(--s5)}h1{font-size:42px}.study{padding:var(--s5) var(--s4)}.cards{grid-template-columns:1fr!important;gap:var(--s3)}.word{font-size:36px}.tree ol{grid-template-columns:1fr 1fr}footer{padding:var(--s4)}.actions{justify-content:stretch}.actions .btn{flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body style="min-height:0;display:block"><div style="display:flex;gap:16px;flex-wrap:wrap;padding:16px"><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn " >Open the canon</button><small style="color:var(--muted);font-size:12px;line-height:16px">default</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-hover" >Open the canon</button><small style="color:var(--muted);font-size:12px;line-height:16px">hover</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-active" >Open the canon</button><small style="color:var(--muted);font-size:12px;line-height:16px">active</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-focus" >Open the canon</button><small style="color:var(--muted);font-size:12px;line-height:16px">focus</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-disabled" disabled>Open the canon</button><small style="color:var(--muted);font-size:12px;line-height:16px">disabled</small></div><div style="display:flex;flex-direction:column;gap:4px"><input class="inp " value="entropy" aria-label="search" ><small style="color:var(--muted);font-size:12px;line-height:16px">input default</small></div><div style="display:flex;flex-direction:column;gap:4px"><input class="inp is-focus" value="Noether" aria-label="search" ><small style="color:var(--muted);font-size:12px;line-height:16px">input focus</small></div><div style="display:flex;flex-direction:column;gap:4px"><input class="inp is-disabled" value="" aria-label="search" disabled><small style="color:var(--muted);font-size:12px;line-height:16px">input disabled</small></div></div></body></html>
