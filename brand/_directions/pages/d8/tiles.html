<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flag Tiles</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Space+Mono:wght@700&family=Noto+Sans:wght@400;800&family=Noto+Sans+Hebrew:wght@800&family=Noto+Sans+Arabic:wght@800&family=Noto+Sans+Devanagari:wght@800&family=Noto+Sans+SC:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tiles.css">
<style>
*{box-sizing:border-box;margin:0}
body{background:#F6EEDC;background-image:radial-gradient(#e2d4b4 1.4px,transparent 1.5px);background-size:32px 32px;font-family:Nunito;color:#231F20;padding:60px 80px}
h2{font-family:'Space Mono';font-size:18px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 22px}
.row{display:flex;gap:28px;margin-bottom:64px;flex-wrap:wrap}
p{font-family:'Space Mono';font-size:14px;color:#666}
</style></head><body>
<h2>Word tiles</h2><div class="row" data-tiles="text"></div>
<h2>Flag tiles</h2><div class="row" data-tiles="bare"></div>
<p>Click a word tile to hear it. Recorded audio drops in at audio/&lt;code&gt;.mp3, else browser speech. Codex art drops in at flags/&lt;code&gt;.svg. <a href="tiles-styles.html">All saved styles</a></p>
<script src="tiles.js"></script></body></html>
