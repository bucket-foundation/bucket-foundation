<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omega Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#5B1A4A;font-family:'Space Mono',monospace;color:#F6EEDC;user-select:none}
.top{position:fixed;top:16px;left:0;right:0;text-align:center;font-family:Fredoka;font-size:28px}
.top small{display:block;font-family:'Space Mono';font-size:13px;opacity:.8}
.deck{position:fixed;left:50%;top:50%;width:min(86vw,60vh);aspect-ratio:10/11.4;transform:translate(-50%,-50%)}
.card{position:absolute;inset:0;background:#F6EEDC;border-radius:22px;padding:14px;box-shadow:0 10px 0 rgba(0,0,0,.35);transition:transform .35s ease,opacity .35s;touch-action:none;cursor:grab;color:#231F20}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;pointer-events:none}
.card .m{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.card .m b{font-family:Fredoka;font-size:24px;text-transform:none;letter-spacing:0}
.card.star{box-shadow:0 0 0 5px #E9A23B,0 10px 0 rgba(0,0,0,.35)}
.card.star::after{content:"★";position:absolute;top:22px;right:26px;font-size:34px;color:#E9A23B;text-shadow:0 2px 0 #231F20}
.bar{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:12px}
.bar button{font-family:'Space Mono';font-weight:700;font-size:15px;padding:12px 18px;border-radius:12px;border:0;cursor:pointer;background:#F6EEDC;color:#231F20;box-shadow:0 4px 0 #3A0F2F}
.bar button.s{background:#E9A23B}
</style></head><body>
<div class="top">℧ cards<small id="ct"></small></div>
<div class="deck" id="d"></div>
<div class="bar"><button id="pv">← back</button><button class="s" id="st">★ star</button><button id="nx">next →</button><button id="sh">shuffle</button><button id="so">starred</button></div>
<script>
const K='omega-picks';let picks=new Set();try{picks=new Set(JSON.parse(localStorage.getItem(K)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify([...picks]))}catch(e){}};
let all=[],L=[],i=0,only=false;
const card=(m,k)=>`<div class="card${picks.has(m.file)?' star':''}" style="transform:translate(${k*6}px,${k*6}px) rotate(${(k%2?1:-1)*k*2}deg);z-index:${10-k}"><img src="omega/${m.file}" alt=""><div class="m"><b>${m.subject}</b><span>${m.style}</span></div></div>`;
function draw(){
 if(!L.length){d.innerHTML='';ct.textContent='no starred cards yet';return}
 i=(i+L.length)%L.length;
 d.innerHTML=[2,1,0].map(k=>card(L[(i+k)%L.length],k)).join('');
 ct.textContent=`${i+1} / ${L.length}${only?' starred':''}`;
 const top=d.lastElementChild;let x0=null,dx=0;
 top.onpointerdown=e=>{x0=e.clientX;top.setPointerCapture(e.pointerId);top.style.transition='none'};
 top.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;top.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`};
 top.onpointerup=()=>{top.style.transition='';const d0=dx;x0=null;dx=0;if(Math.abs(d0)>90)fly(d0>0?1:-1);else if(Math.abs(d0)<6)toggle();else top.style.transform=''};
 top.ondblclick=toggle;
}
function fly(dir){const top=d.lastElementChild;if(!top)return;top.style.transform=`translateX(${dir*120}vw) rotate(${dir*30}deg)`;top.style.opacity=0;setTimeout(()=>{i+=dir>0?1:-1;draw()},220)}
function toggle(){const m=L[i];if(!m)return;picks.has(m.file)?picks.delete(m.file):picks.add(m.file);save();d.lastElementChild.classList.toggle('star')}
function pick(){L=only?all.filter(m=>picks.has(m.file)):all.slice();i=0;draw()}
nx.onclick=()=>fly(1);pv.onclick=()=>fly(-1);st.onclick=toggle;
sh.onclick=()=>{for(let a=all.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[all[a],all[b]]=[all[b],all[a]]}pick()};
so.onclick=()=>{only=!only;so.textContent=only?'all':'starred';pick()};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')fly(1);if(e.key==='ArrowLeft')fly(-1);if(e.key===' '||e.key==='s'){e.preventDefault();toggle()}});
fetch('omega/manifest.json').then(r=>r.json()).then(j=>{all=j;pick()});
</script></body></html>
