name: polingual-ux

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polingual-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  polingual-ux-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: window study screens match the polingual-ux-v1 screenshots and DOM
        run: bash packages/bkt-ui/ux-freeze/run.sh window
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: local supabase
        run: npx supabase@2.117.0 start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: env
        run: |
          npx supabase@2.117.0 status -o env > "$RUNNER_TEMP/supa.env"
          set -a; . "$RUNNER_TEMP/supa.env"; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local
      - name: site server
        run: |
          node scripts/sync-academy.mjs
          (npx next dev -p 3100 > dev.log 2>&1 &)
          for i in $(seq 1 90); do
            if wget -q -O /dev/null http://localhost:3100/sign-in; then break; fi
            sleep 2
          done
      - name: placement screens match the polingual-ux-v1 screenshots and DOM
        run: bash packages/bkt-ui/ux-freeze/run.sh placement
      - name: screenshots that missed their baseline
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polingual-ux-diff
          path: packages/bkt-ui/test-results/
          if-no-files-found: ignore
