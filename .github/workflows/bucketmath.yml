name: bucketmath

on:
  pull_request:
    paths:
      - "lean/**"
      - "tools/bucketmath/**"
      - "tools/prime-directions/lean/**"
      - "papers/history-hypothesis-engine/lean/**"
      - ".github/workflows/bucketmath.yml"
  push:
    branches: [dev]
    paths:
      - "lean/**"
      - "tools/bucketmath/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Build, axiom gate and manifest drift
        run: python3 tools/bucketmath/bm.py check
      - name: Unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tools/bucketmath/tests
      - name: Lint math docs
        run: python3 tools/bucketmath/bm.py lint tools/prime-directions/MATH.md docs/agents/MATH-CONTRACT.md
