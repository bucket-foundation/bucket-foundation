name: Mirror war.gov PURSUE
# Strategy: Akamai blocks both residential-rate-limited and datacenter ASNs
# directly. Path is to (a) push URLs to Internet Archive Save Page Now from
# multiple GH runners (rotating IPs spreads SPN rate limit), (b) once Wayback
# has them, mirror via Wayback proxy. Schedule re-runs daily until OK count
# stabilizes.

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC — gives IA crawler time + lets local Akamai bans clear
    - cron: '0 6 * * *'

jobs:
  spn-shard:
    name: spn-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Submit shard to IA Save Page Now
        run: |
          set +e
          URLS=_intake/war-gov-pursue-release-01/urls.tsv
          TOTAL=8
          i=0
          ok=0; fail=0; rl=0
          while IFS=$'\t' read -r kind url; do
            [ -z "$url" ] && continue
            [ "$kind" = "THUMB" ] && continue
            if [ $((i % TOTAL)) -ne ${{ matrix.shard }} ]; then i=$((i+1)); continue; fi
            i=$((i+1))
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 60 \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" \
              "https://web.archive.org/save/$url")
            case "$code" in
              200) ok=$((ok+1)); echo "OK   $url" ;;
              429|523) rl=$((rl+1)); echo "RL   $code $url"; sleep 30 ;;
              *) fail=$((fail+1)); echo "FAIL $code $url" ;;
            esac
            sleep 8
          done < "$URLS"
          echo "shard ${{ matrix.shard }}: ok=$ok rl=$rl fail=$fail"

  remirror:
    needs: spn-shard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Pull from Wayback (now hopefully populated)
        run: |
          set +e
          mkdir -p out/{pdfs,videos,images}
          URLS=_intake/war-gov-pursue-release-01/urls.tsv
          TOTAL=8
          i=0
          while IFS=$'\t' read -r kind url; do
            [ -z "$url" ] && continue
            [ "$kind" = "THUMB" ] && continue
            if [ $((i % TOTAL)) -ne ${{ matrix.shard }} ]; then i=$((i+1)); continue; fi
            i=$((i+1))
            fn=$(basename "$url" | tr ' ' '_')
            case "$kind" in
              PDF*) sub=pdfs ;;
              VID*) sub=videos ;;
              IMG*) sub=images ;;
              *)    sub=other ;;
            esac
            mkdir -p "out/$sub"
            wb="https://web.archive.org/web/2026id_/$url"
            code=$(curl -sL -o "out/$sub/$fn" -w "%{http_code}" --max-time 300 \
              -A "Mozilla/5.0" "$wb")
            sz=$(stat -c%s "out/$sub/$fn" 2>/dev/null || echo 0)
            if [ "$code" != "200" ] || [ "$sz" -lt 1000 ]; then
              rm -f "out/$sub/$fn"
              echo "FAIL $code $sz $kind $fn"
            else
              echo "OK $sz $sub/$fn"
            fi
            sleep 1
          done < "$URLS"
      - uses: actions/upload-artifact@v4
        with:
          name: pursue-shard-${{ matrix.shard }}
          path: out/
          retention-days: 14
