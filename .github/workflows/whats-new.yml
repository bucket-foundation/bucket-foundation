name: whats-new

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: whats-new-main
  cancel-in-progress: false

jobs:
  whats-new:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'whats-new:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Leak filter and production tests
        run: node --test scripts/test-whats-new.mjs

      - name: Determine SHA range
        id: shas
        run: |
          FROM="${{ github.event.before }}"
          TO="${{ github.sha }}"
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            FROM=$(git rev-parse HEAD^ || echo "")
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO"     >> "$GITHUB_OUTPUT"

      - name: Build whats-new entries
        if: steps.shas.outputs.from != ''
        env:
          FROM_SHA: ${{ steps.shas.outputs.from }}
          TO_SHA:   ${{ steps.shas.outputs.to }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHATS_NEW_PRIVATE_TERMS: ${{ vars.WHATS_NEW_PRIVATE_TERMS }}
          WHATS_NEW_INTERNAL_HOSTS: ${{ vars.WHATS_NEW_INTERNAL_HOSTS }}
        run: node scripts/build-whats-new-entry.mjs

      - name: Leak filter over the written file
        run: node --test scripts/test-whats-new.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain data/whats-new.json)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "bucket-bot"
          git config user.email "bot@bucket.foundation"
          git add data/whats-new.json
          git commit -m "whats-new: append merged PR entries [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push attempt $attempt failed, rebasing on origin/main"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
