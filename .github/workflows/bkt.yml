name: bkt

on:
  pull_request:
    paths:
      - "packages/bkt/**"
      - "packages/bkt-ui/**"
      - "src/lib/academy/**"
      - "tools/helix/**"
      - "learning/app/corpus/**"
      - ".github/workflows/bkt.yml"
  push:
    branches: [dev]
    paths:
      - "packages/bkt/**"
      - "packages/bkt-ui/**"
      - "src/lib/academy/**"

permissions:
  contents: read

jobs:
  bkt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: analyzer requirements
        run: python -m pip install -r packages/bkt/analyze/requirements.txt
      - name: install
        working-directory: packages/bkt
        run: bun install --frozen-lockfile
      - name: engine guard, store, serve and routes
        working-directory: packages/bkt
        run: bun run pack:content && bun test
      - name: typecheck
        working-directory: packages/bkt
        run: bun run typecheck

  bkt-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - name: install
        working-directory: packages/bkt-ui
        run: bun install --frozen-lockfile
      - name: typecheck and test
        working-directory: packages/bkt-ui
        run: bun run typecheck && bun run test
      - name: build and size gate
        working-directory: packages/bkt-ui
        run: bun run build && bun run size
