name: bkt

on:
  pull_request:
    paths:
      - "packages/bkt/**"
      - "packages/bkt-ui/**"
      - "src/lib/academy/**"
      - "src/lib/research-os/**"
      - "src/components/research-os/**"
      - "src/app/research-os/**"
      - "src/app/api/research-os/**"
      - "packages/ros-contract/**"
      - "tools/helix/**"
      - "learning/app/corpus/**"
      - "scripts/release/**"
      - "public/bucket_logo.webp"
      - ".github/workflows/bkt.yml"
  push:
    branches: [dev]
    paths:
      - "packages/bkt/**"
      - "packages/bkt-ui/**"
      - "src/lib/academy/**"

permissions:
  contents: read

jobs:
  bkt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: analyzer requirements
        run: python -m pip install -r packages/bkt/analyze/requirements.txt
      - name: install
        working-directory: packages/bkt
        run: bun install --frozen-lockfile
      - name: engine guard, store, serve and routes
        working-directory: packages/bkt
        run: bun run pack:content && bun test
      - name: typecheck
        working-directory: packages/bkt
        run: bun run typecheck

  ros-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - name: install
        run: npm ci --ignore-scripts && (cd packages/ros-contract && bun install --frozen-lockfile)
      - name: contract, web regression and runtime-neutral tests
        working-directory: packages/ros-contract
        run: bun test && bun run typecheck

  bkt-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - name: install
        working-directory: packages/bkt-ui
        run: bun install --frozen-lockfile
      - name: typecheck and test
        working-directory: packages/bkt-ui
        run: bun run typecheck && bun run test
      - name: build and size gate
        working-directory: packages/bkt-ui
        run: bun run build && bun run size

  appimage:
    runs-on: ubuntu-latest
    needs: [bkt, bkt-ui]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - name: image tools
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends imagemagick webp
      - name: build the unsigned AppImage
        run: bash scripts/release/build-appimage.sh "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/build.log"
      - name: record sizes
        run: |
          echo "### AppImage size" >> "$GITHUB_STEP_SUMMARY"
          grep "^appimage " "$RUNNER_TEMP/build.log" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP"/release/*.sizes.json >> "$GITHUB_STEP_SUMMARY"
      - name: release signing test
        run: node --test scripts/test-release-signing.mjs
