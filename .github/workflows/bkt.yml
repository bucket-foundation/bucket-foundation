name: bkt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/bkt/**"
      - "packages/bkt-ui/**"
      - "src/lib/academy/**"
      - "src/lib/research-os/**"
      - "src/components/research-os/**"
      - "src/app/research-os/**"
      - "src/app/api/research-os/**"
      - "packages/ros-contract/**"
      - "tools/helix/**"
      - "learning/app/corpus/**"
      - "scripts/release/**"
      - "public/bucket_logo.webp"
      - ".github/workflows/bkt.yml"
  push:
    tags: ["bkt-v*"]
    branches: [dev]
    paths:
      - "packages/bkt/**"
      - "packages/bkt-ui/**"
      - "src/lib/academy/**"

permissions:
  contents: read

jobs:
  bkt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: analyzer requirements
        run: python -m pip install -r packages/bkt/analyze/requirements.txt
      - name: install
        working-directory: packages/bkt
        run: bun install --frozen-lockfile
      - name: engine guard, store, serve and routes
        working-directory: packages/bkt
        run: bun run pack:content && bun test
      - name: typecheck
        working-directory: packages/bkt
        run: bun run typecheck

  ros-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - name: install
        run: npm ci --ignore-scripts && (cd packages/ros-contract && bun install --frozen-lockfile)
      - name: public content for bkt serve
        working-directory: packages/bkt
        run: bun run src/pack/staff.ts
      - name: contract, web regression and runtime-neutral tests
        working-directory: packages/ros-contract
        run: bun test && bun run typecheck

  bkt-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - name: install
        working-directory: packages/bkt-ui
        run: bun install --frozen-lockfile
      - name: typecheck and test
        working-directory: packages/bkt-ui
        run: bun run typecheck && bun run test
      - name: build and size gate
        working-directory: packages/bkt-ui
        run: bun run build && bun run size

  appimage:
    runs-on: ubuntu-latest
    needs: [bkt, bkt-ui]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - name: image tools
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends imagemagick webp
      - name: build the unsigned AppImage
        run: bash scripts/release/build-appimage.sh "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/build.log"
      - name: record sizes
        run: |
          echo "### AppImage size" >> "$GITHUB_STEP_SUMMARY"
          grep "^appimage " "$RUNNER_TEMP/build.log" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP"/release/*.sizes.json >> "$GITHUB_STEP_SUMMARY"
      - name: release signing test
        run: node --test scripts/test-release-signing.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: appimage
          path: ${{ runner.temp }}/release/*.AppImage
          if-no-files-found: error

  binaries:
    runs-on: ubuntu-latest
    needs: [bkt]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - name: compile bkt for every target
        run: bash scripts/release/build-binaries.sh "$RUNNER_TEMP/bin" | tee "$RUNNER_TEMP/bin.log"
      - name: run the linux binary
        run: |
          test "$("$RUNNER_TEMP/bin/bkt-linux-x64" --version)" = "$(bash scripts/release/version.sh)"
          ls -l "$RUNNER_TEMP/bin" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binaries
          path: ${{ runner.temp }}/bin/bkt-*
          if-no-files-found: error

  sign:
    runs-on: ubuntu-latest
    needs: [binaries, appimage]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: sign with the release key on a tag, or a throwaway key otherwise
        env:
          SIGNING_KEY: ${{ startsWith(github.ref, 'refs/tags/bkt-v') && secrets.BKT_RELEASE_SIGNING_KEY || '' }}
          SIGNING_PASSPHRASE: ${{ startsWith(github.ref, 'refs/tags/bkt-v') && secrets.BKT_RELEASE_SIGNING_PASSPHRASE || '' }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/bkt-v') }}
        run: bash scripts/release/ci-sign.sh "$RUNNER_TEMP/dist" "$RUNNER_TEMP/keys"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  install:
    needs: [sign]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: bkt-linux-x64
          - os: ubuntu-24.04-arm
            asset: bkt-linux-arm64
          - os: macos-latest
            asset: bkt-darwin-arm64
          - os: windows-latest
            asset: bkt-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed
          path: ${{ runner.temp }}/dist
      - name: expected version
        shell: bash
        run: echo "BKT_EXPECT=$(bash scripts/release/version.sh)" >> "$GITHUB_ENV"
      - name: install.sh verifies and installs
        if: runner.os != 'Windows'
        shell: bash
        env:
          BKT_DOWNLOAD_BASE: ${{ runner.temp }}/dist
          BKT_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          script=scripts/install.sh
          if [ -f "$BKT_DOWNLOAD_BASE/throwaway.pub" ]; then
            script=$RUNNER_TEMP/install.sh
            sed "s|^RELEASE_PUBKEY=.*|RELEASE_PUBKEY=\"$(cat "$BKT_DOWNLOAD_BASE/throwaway.pub")\"|" scripts/install.sh > "$script"
          fi
          sh "$script"
          bad=$RUNNER_TEMP/bad && cp -r "$BKT_DOWNLOAD_BASE" "$bad" && printf x >> "$bad/${{ matrix.asset }}"
          if BKT_DOWNLOAD_BASE=$bad BKT_INSTALL_DIR=$RUNNER_TEMP/bad-bin sh "$script"; then echo "a tampered binary installed" >&2; exit 1; fi
          if BKT_DOWNLOAD_BASE=$BKT_DOWNLOAD_BASE BKT_INSTALL_DIR=$RUNNER_TEMP/prod-bin sh scripts/install.sh && [ -f "$BKT_DOWNLOAD_BASE/throwaway.pub" ]; then echo "the pinned key accepted a throwaway signature" >&2; exit 1; fi
          echo "BKT_BIN=$BKT_INSTALL_DIR/bkt" >> "$GITHUB_ENV"
      - name: install.ps1 verifies and installs
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BKT_DOWNLOAD_BASE: ${{ runner.temp }}\dist
          BKT_INSTALL_DIR: ${{ runner.temp }}\bin
          BKT_NO_MODIFY_PATH: "1"
        run: |
          $script = 'scripts/install.ps1'
          $pub = Join-Path $env:BKT_DOWNLOAD_BASE 'throwaway.pub'
          if (Test-Path $pub) {
            $script = Join-Path $env:RUNNER_TEMP 'install.ps1'
            $key = (Get-Content $pub -Raw).Trim()
            (Get-Content scripts/install.ps1) -replace '^\$ReleasePubkey = .*$', "`$ReleasePubkey = '$key'" | Set-Content $script
          }
          pwsh -NoProfile -File $script
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bad = Join-Path $env:RUNNER_TEMP 'bad'
          Copy-Item -Recurse $env:BKT_DOWNLOAD_BASE $bad
          Add-Content -NoNewline -Path (Join-Path $bad '${{ matrix.asset }}') -Value 'x'
          $env:BKT_DOWNLOAD_BASE = $bad
          $env:BKT_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bad-bin'
          pwsh -NoProfile -File $script
          if ($LASTEXITCODE -eq 0) { Write-Error 'a tampered binary installed'; exit 1 }
          "BKT_BIN=$env:RUNNER_TEMP\bin\bkt.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          exit 0
      - name: smoke on linux with a libsecret keystore
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends gnome-keyring libsecret-tools dbus-x11
          dbus-run-session -- bash -c 'echo -n smoke | gnome-keyring-daemon --unlock --components=secrets > /dev/null && bun packages/bkt/scripts/smoke.ts "$BKT_BIN" "$BKT_EXPECT"'
      - name: smoke on macos with a Keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p smoke bkt-smoke.keychain
          security list-keychains -d user -s bkt-smoke.keychain
          security default-keychain -s bkt-smoke.keychain
          security unlock-keychain -p smoke bkt-smoke.keychain
          security set-keychain-settings bkt-smoke.keychain
          bun packages/bkt/scripts/smoke.ts "$BKT_BIN" "$BKT_EXPECT"
      - name: smoke on windows with DPAPI
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun packages/bkt/scripts/smoke.ts $env:BKT_BIN $env:BKT_EXPECT

  publish:
    if: startsWith(github.ref, 'refs/tags/bkt-v')
    needs: [sign, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed
          path: ${{ runner.temp }}/dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            ${{ runner.temp }}/dist/bkt-linux-x64
            ${{ runner.temp }}/dist/bkt-linux-arm64
            ${{ runner.temp }}/dist/bkt-darwin-arm64
            ${{ runner.temp }}/dist/bkt-darwin-x64
            ${{ runner.temp }}/dist/bkt-windows-x64.exe
            ${{ runner.temp }}/dist/Bucket-*.AppImage
      - name: upload binaries, AppImage, checksums and signatures to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/publish.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/dist"
