name: bkt

on:
  pull_request:
    paths:
      - "packages/bkt/**"
      - "packages/bkt-ui/**"
      - "src/lib/academy/**"
      - "learning/app/corpus/**"
      - ".github/workflows/bkt.yml"
  push:
    branches: [dev]
    paths:
      - "packages/bkt/**"
      - "packages/bkt-ui/**"
      - "src/lib/academy/**"

jobs:
  bkt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        working-directory: packages/bkt
        run: bun install --frozen-lockfile
      - name: engine guard, store, serve and routes
        working-directory: packages/bkt
        run: bun run pack:content && bun test
      - name: typecheck
        working-directory: packages/bkt
        run: bun run typecheck

  bkt-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        working-directory: packages/bkt-ui
        run: bun install --frozen-lockfile
      - name: typecheck and test
        working-directory: packages/bkt-ui
        run: bun run typecheck && bun run test
      - name: build and size gate
        working-directory: packages/bkt-ui
        run: bun run build && bun run size
