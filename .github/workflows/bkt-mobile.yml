name: bkt-mobile

on:
  pull_request:
    paths:
      - "packages/bkt-mobile/**"
      - "packages/bkt-ui/**"
      - "packages/ros-contract/**"
      - "src/lib/research-os/**"
      - "src/lib/academy/**"
      - ".github/workflows/bkt-mobile.yml"
  push:
    tags: ["bkt-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bkt-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - name: install
        working-directory: packages/bkt-mobile
        run: bun install --frozen-lockfile
      - name: adapter and hardening tests
        working-directory: packages/bkt-mobile
        run: bun test src && bun run typecheck
      - name: web bundle
        working-directory: packages/bkt-mobile
        run: bun run build
      - name: no staff data in the public bundle
        run: bun packages/bkt/scripts/check-no-staff.ts packages/bkt-mobile/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bkt-mobile-web
          path: packages/bkt-mobile/dist
          if-no-files-found: error

  android:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bkt-mobile-web
          path: packages/bkt-mobile/dist
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: sync native project
        working-directory: packages/bkt-mobile
        run: bun install --frozen-lockfile && bunx cap sync android
      - name: unsigned release apk
        working-directory: packages/bkt-mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: collect
        run: |
          out="$RUNNER_TEMP/android"
          mkdir -p "$out"
          cp packages/bkt-mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "$out/Bucket-android-unsigned.apk"
          (cd "$out" && sha256sum * > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt)
          echo "OUT=$out" >> "$GITHUB_ENV"
      - name: throwaway signature for the emulator smoke
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -alias smoke -keyalg RSA -keysize 2048 -validity 1 -storepass smokepass -keypass smokepass -dname "CN=smoke" >/dev/null
          "$bt/zipalign" -f 4 "$OUT/Bucket-android-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:smokepass --out "$RUNNER_TEMP/smoke.apk" "$RUNNER_TEMP/aligned.apk"
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: emulator smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash packages/bkt-mobile/scripts/android-smoke.sh "$RUNNER_TEMP/smoke.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bkt-mobile-android
          path: ${{ env.OUT }}/*
          if-no-files-found: error

  ios:
    needs: web
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bkt-mobile-web
          path: packages/bkt-mobile/dist
      - name: sync native project
        working-directory: packages/bkt-mobile
        run: bun install --frozen-lockfile && bunx cap sync ios
      - name: unsigned device build
        working-directory: packages/bkt-mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-device" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: simulator build
        working-directory: packages/bkt-mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build
      - name: simulator smoke
        run: bash packages/bkt-mobile/scripts/ios-smoke.sh "$RUNNER_TEMP/dd-sim/Build/Products/Release-iphonesimulator/App.app"
      - name: collect
        run: |
          out="$RUNNER_TEMP/ios"
          mkdir -p "$out/Payload"
          cp -R "$RUNNER_TEMP/dd-device/Build/Products/Release-iphoneos/App.app" "$out/Payload/"
          (cd "$out" && zip -qry Bucket-ios-unsigned.ipa Payload && rm -rf Payload && shasum -a 256 * > SHA256SUMS-ios.txt && cat SHA256SUMS-ios.txt)
          echo "OUT=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bkt-mobile-ios
          path: ${{ env.OUT }}/*
          if-no-files-found: error

  attest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bkt-mobile-android
          path: bundles
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bkt-mobile-ios
          path: bundles
      - name: verify checksums
        run: cd bundles && for f in SHA256SUMS-*.txt; do sha256sum -c "$f"; done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            bundles/*.apk
            bundles/*.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/bkt-v')
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bkt-mobile-android
          path: bundles
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bkt-mobile-ios
          path: bundles
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Unsigned builds." || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" bundles/* --clobber
