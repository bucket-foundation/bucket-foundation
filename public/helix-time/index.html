<title>Solvability Helix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap">
<style>
:root{--bg:#f3f4f1;--panel:#ffffff;--fg:#1b2420;--muted:#5d6b64;--line:#d5dbd6;--accent:#1f6f5c;--display:"Fraunces",Georgia,serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1513;--panel:#16201c;--fg:#e6ece8;--muted:#93a39b;--line:#2a3833;--accent:#5fc3a6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1513;--panel:#16201c;--fg:#e6ece8;--muted:#93a39b;--line:#2a3833;--accent:#5fc3a6;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:500;font-size:22px;margin:0}
.modes{display:flex;gap:4px}
.modes button{font:500 13px var(--body);padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.yr{display:flex;align-items:center;gap:8px;font:13px var(--mono);font-variant-numeric:tabular-nums;flex:1;min-width:200px}
.yr input{flex:1;accent-color:var(--accent)}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0}
#stage canvas{display:block}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:6px 8px;font-size:12px;border-radius:4px;max-width:260px}
.hint{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--muted)}
.legend{position:absolute;left:16px;top:12px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
aside{width:380px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:16px;gap:10px;overflow:auto}
aside h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0}
aside p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
#circ{width:100%;aspect-ratio:1;max-width:100%}
#list{font-size:12px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
#list div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
@media (max-width:760px){main{flex-direction:column}aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:48%}}
</style>
</head><body><header>
<h1>Solvability Helix</h1>
<div class="modes" role="group" aria-label="View">
<button id="m-helix" aria-pressed="true">Helix</button><button id="m-slices" aria-pressed="false">Slices</button><button id="m-sphere" aria-pressed="false">Sphere</button>
</div>
<label class="yr" for="year">Year <input id="year" type="range" min="1600" max="2026" value="2026"><b id="yv">2026</b></label>
</header>
<main>
<div id="stage"><div class="legend" id="legend"></div><div id="tip" hidden></div><div class="hint">Drag to orbit. Click a ring or a problem to open its slice.</div></div>
<aside>
<h2 id="sTitle">Slice</h2>
<p id="sSub"></p>
<canvas id="circ" width="700" height="700"></canvas>
<p>Angle is embedding rank. Distance from the centre is solvability. Lines join problems that share a keyword. A filled dot is resolved by the chosen year.</p>
<div id="list"></div>
</aside>
</main>

const COL={mathematics:"#3d6fb0",physics:"#e07b1f",chemistry:"#3c9a4b",information:"#a55b9b",biophysics:"#d8453e",cosmology:"#4fa9a2",mind:"#d9a826",bucketmath:"#8a6a4f"};
const ERAS=[[1600,1899,"Before 1900"],[1900,1949,"1900 to 1949"],[1950,1979,"1950 to 1979"],[1980,1999,"1980 to 1999"],[2000,2019,"2000 to 2019"],[2020,2026,"2020 to 2026"]];
const N=DATA.map(r=>({id:r[0],t:r[1],b:r[2],lv:r[3],p:r[4],rs:r[5],s:r[6],th:r[7],tok:r[8]}));
N.forEach(n=>{n.e=ERAS.findIndex(e=>n.p>=e[0]&&n.p<=e[1]);const e=ERAS[n.e];n.u=n.e+(n.p-e[0])/(e[1]-e[0]+1)});
const EDGES=[];for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++)if(N[i].tok.some(k=>N[j].tok.includes(k)))EDGES.push([i,j]);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
document.getElementById("legend").innerHTML=Object.entries(COL).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join("");
const stage=document.getElementById("stage");
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(2,devicePixelRatio));stage.prepend(R.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,0.1,200);
const ctl=new THREE.OrbitControls(cam,R.domElement);ctl.enableDamping=true;
const AX=new THREE.Vector3(1,0,1).normalize(),UP=new THREE.Vector3(0,1,0),SIDE=new THREE.Vector3().crossVectors(AX,UP).normalize();
const L=18,start=AX.clone().multiplyScalar(-L/2);
const dot=new THREE.SphereGeometry(0.16,14,10);
const meshes=N.map(n=>{const m=new THREE.Mesh(dot,new THREE.MeshBasicMaterial({color:COL[n.b]||"#888",transparent:true}));m.userData.n=n;scene.add(m);return m});
const guides=new THREE.Group();scene.add(guides);
let mode="helix",year=2026;
function axisPos(u){return start.clone().add(AX.clone().multiplyScalar(u/ERAS.length*L))}
function ringAt(u,r){const c=axisPos(u);return a=>c.clone().add(UP.clone().multiplyScalar(Math.sin(a)*r)).add(SIDE.clone().multiplyScalar(Math.cos(a)*r))}
function place(n){
 const a=n.th*Math.PI*2,r=0.6+n.s*1.8;
 if(mode==="helix")return ringAt(n.u,r)(a+n.u*Math.PI*2);
 if(mode==="slices")return ringAt(n.e+0.5,r)(a);
 const lat=(n.u/ERAS.length-0.5)*Math.PI*0.9,rad=6;return new THREE.Vector3(Math.cos(lat)*Math.cos(a)*rad,Math.sin(lat)*rad,Math.cos(lat)*Math.sin(a)*rad)}
function lineMat(o){return new THREE.LineBasicMaterial({color:css("--muted"),transparent:true,opacity:o})}
const surf=new THREE.Group();scene.add(surf);
function surfR(u,a){let w=0,v=0;N.forEach(n=>{if(n.p>year)return;const au=mode==="slices"?n.e+0.5:n.u,d=Math.atan2(Math.sin(a-(n.th*Math.PI*2+(mode==="helix"?n.u*Math.PI*2:0))),Math.cos(a-(n.th*Math.PI*2+(mode==="helix"?n.u*Math.PI*2:0)))),k=Math.exp(-((u-au)**2)/0.5-d*d/0.4);w+=k;v+=k*(0.6+n.s*1.8)});return w>1e-3?v/w:0.6}
function mesh(pos,idx,op){const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));geo.setIndex(idx);const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:css("--accent"),transparent:true,opacity:op,side:THREE.DoubleSide,depthWrite:false}));surf.add(m);surf.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo),lineMat(0.08)))}
function buildSurface(){surf.clear();
 if(mode==="sphere"){surf.add(new THREE.Mesh(new THREE.SphereGeometry(5.9,48,32),new THREE.MeshBasicMaterial({color:css("--accent"),transparent:true,opacity:0.07,depthWrite:false})));return}
 const A=48,pos=[],idx=[];
 if(mode==="helix"){const U=72;for(let i=0;i<=U;i++){const u=i/U*ERAS.length;for(let j=0;j<=A;j++){const a=j/A*Math.PI*2;pos.push(...ringAt(u,surfR(u,a))(a).toArray())}}
  for(let i=0;i<U;i++)for(let j=0;j<A;j++){const q=i*(A+1)+j;idx.push(q,q+1,q+A+1,q+1,q+A+2,q+A+1)}mesh(pos,idx,0.1);return}
 ERAS.forEach((e,i)=>{const u=i+0.5,b=pos.length/3;pos.push(...axisPos(u).toArray());for(let j=0;j<=A;j++){const a=j/A*Math.PI*2;pos.push(...ringAt(u,surfR(u,a))(a).toArray())}for(let j=0;j<A;j++)idx.push(b,b+1+j,b+2+j)});mesh(pos,idx,0.16)}
function build(){
 guides.clear();
 if(mode==="sphere"){
  for(let e=0;e<=ERAS.length;e++){const lat=(e/ERAS.length-0.5)*Math.PI*0.9,pts=[];for(let k=0;k<=64;k++){const a=k/64*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(lat)*Math.cos(a)*6,Math.sin(lat)*6,Math.cos(lat)*Math.sin(a)*6))}const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat(0.35));if(e<ERAS.length)l.userData.era=e;guides.add(l)}
  for(let k=0;k<12;k++){const a=k/12*Math.PI*2,pts=[];for(let j=0;j<=32;j++){const lat=(j/32-0.5)*Math.PI*0.9;pts.push(new THREE.Vector3(Math.cos(lat)*Math.cos(a)*6,Math.sin(lat)*6,Math.cos(lat)*Math.sin(a)*6))}guides.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat(0.15)))}
  cam.position.set(0,4,15);
 }else{
  guides.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([axisPos(0),axisPos(ERAS.length)]),lineMat(0.6)));
  if(mode==="helix"){const pts=[];for(let k=0;k<=600;k++){const u=k/600*ERAS.length;pts.push(ringAt(u,1.5)(u*Math.PI*2))}guides.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat(0.25)))}
  ERAS.forEach((e,i)=>{const f=ringAt(mode==="slices"?i+0.5:i,2.5),pts=[];for(let k=0;k<=64;k++)pts.push(f(k/64*Math.PI*2));const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat(mode==="slices"?0.55:0.3));l.userData.era=i;guides.add(l);
   const disk=new THREE.Mesh(new THREE.CircleGeometry(2.5,48),new THREE.MeshBasicMaterial({color:css("--accent"),transparent:true,opacity:0.05,side:THREE.DoubleSide}));disk.position.copy(f(0).add(f(Math.PI)).multiplyScalar(0.5));disk.lookAt(disk.position.clone().add(AX));disk.userData.era=i;guides.add(disk)});
  cam.position.set(-4,17,12);
 }
 ctl.target.set(0,0,0);refresh();buildSurface()}
function refresh(){meshes.forEach(m=>{const n=m.userData.n;m.position.copy(place(n));const vis=n.p<=year;m.visible=vis;const solved=n.rs&&n.rs<=year;m.material.opacity=solved?1:0.55;m.scale.setScalar(solved?1.25:1)})}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener("resize",resize);
const ray=new THREE.Raycaster(),mp=new THREE.Vector2(),tip=document.getElementById("tip");
function pick(ev){const b=R.domElement.getBoundingClientRect();mp.set((ev.clientX-b.left)/b.width*2-1,-(ev.clientY-b.top)/b.height*2+1);ray.setFromCamera(mp,cam);ray.params.Line.threshold=0.15;return ray.intersectObjects([...meshes.filter(m=>m.visible),...guides.children.filter(g=>g.userData.era!==undefined)])[0]}
R.domElement.addEventListener("pointermove",ev=>{const h=pick(ev),n=h&&h.object.userData.n;if(n){tip.hidden=false;tip.style.left=ev.offsetX+12+"px";tip.style.top=ev.offsetY+12+"px";tip.textContent=`${n.t} · posed ${n.p}${n.rs?", resolved "+n.rs:""} · solvability ${n.s.toFixed(2)}`}else tip.hidden=true});
let down;R.domElement.addEventListener("pointerdown",ev=>down=[ev.clientX,ev.clientY]);
R.domElement.addEventListener("pointerup",ev=>{if(!down||Math.hypot(ev.clientX-down[0],ev.clientY-down[1])>5)return;const h=pick(ev);if(!h)return;const n=h.object.userData.n;openSlice(n?n.e:h.object.userData.era,n)});
const cv=document.getElementById("circ"),g=cv.getContext("2d");let cur=0,hl=null;
function openSlice(e,hn){cur=e;hl=hn||null;drawSlice()}
function drawSlice(){
 const E=ERAS[cur],ns=N.filter(n=>n.e===cur&&n.p<=year),W=cv.width,c=W/2,Rm=W/2-70;
 document.getElementById("sTitle").textContent=E[2];
 document.getElementById("sSub").textContent=`${ns.length} problems posed, ${ns.filter(n=>n.rs&&n.rs<=year).length} resolved by ${year}`;
 g.clearRect(0,0,W,W);g.strokeStyle=css("--line");g.lineWidth=1;
 [0.25,0.5,0.75,1].forEach(f=>{g.beginPath();g.arc(c,c,Rm*f,0,7);g.stroke()});
 g.fillStyle=css("--muted");g.font="18px IBM Plex Mono, monospace";[0.5,1].forEach(f=>g.fillText(f.toFixed(1),c+4,c-Rm*f+18));
 const P=n=>{const a=n.th*Math.PI*2,r=Rm*n.s;return[c+Math.cos(a)*r,c-Math.sin(a)*r]};
 const idx=new Set(ns.map(n=>N.indexOf(n)));g.strokeStyle=css("--muted");g.globalAlpha=0.3;
 EDGES.forEach(([i,j])=>{if(idx.has(i)&&idx.has(j)){const a=P(N[i]),b=P(N[j]);g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}});g.globalAlpha=1;
 ns.forEach(n=>{const[x,y]=P(n),solved=n.rs&&n.rs<=year;g.beginPath();g.arc(x,y,n===hl?13:9,0,7);g.fillStyle=COL[n.b];g.strokeStyle=COL[n.b];g.lineWidth=3;solved?g.fill():g.stroke()});
 g.fillStyle=css("--fg");g.font="17px IBM Plex Sans, sans-serif";ns.forEach(n=>{const[x,y]=P(n);const t=n.t.length>26?n.t.slice(0,25)+"…":n.t;g.textAlign=x>c?"left":"right";g.fillText(t,x+(x>c?14:-14),y+5)});
 document.getElementById("list").innerHTML=ns.slice().sort((a,b)=>b.s-a.s).map(n=>`<div${n===hl?' style="color:var(--accent)"':""}><span>${n.t}</span><span>${n.p} · ${n.s.toFixed(2)}</span></div>`).join("")}
const yr=document.getElementById("year"),yv=document.getElementById("yv");
yr.addEventListener("input",()=>{year=+yr.value;yv.textContent=year;refresh();buildSurface();drawSlice()});
["helix","slices","sphere"].forEach(k=>document.getElementById("m-"+k).addEventListener("click",()=>{mode=k;document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",b.id==="m-"+k));build()}));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{build();drawSlice()});
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;ctl.autoRotate=!still&&mode==="sphere";
(function loop(){ctl.autoRotate=!still&&mode==="sphere";ctl.update();R.render(scene,cam);requestAnimationFrame(loop)})();
resize();build();openSlice(3);
