<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EFE8D4" />
    <title>Bucket Academy · learn the nucleus</title>
    <meta name="description" content="Learn the nucleus of any branch of knowledge — spaced repetition over a foundations-first graph." />
    <!-- iOS standalone / install niceties -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Academy" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Bucket type system: Fraunces (body serif) + Cinzel (display caps) + JetBrains Mono.
         preconnect to cut DNS/connection overhead; font-display:optional kills late-font CLS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Cinzel:wght@500;600&family=JetBrains+Mono:wght@400;500&display=optional"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <!-- KaTeX for equation rendering (degrades to raw TeX offline). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <!-- markdown rendering for full lessons (degrades to plain text if offline) -->
    <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="screen"><div class="hero"><h1>Loading…</h1></div></div>
    </div>
    <!-- adaptive.js MUST load before engine.js: engine reads window.Adaptive. -->
    <script src="js/fsrs.js"></script>
    <script src="js/adaptive.js"></script>
    <script src="js/engine.js"></script>
    <!-- Optional sign-in + cross-device sync + public Mastery Profile (bkt-su9, bkt-coh).
         auth-config.js is generated by scripts/sync-academy.mjs; empty = auth disabled. -->
    <script src="js/auth-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth-ui.js"></script>
    <script src="js/library.js"></script>
    <!-- Premium visual & motion: deterministic procedural art + haptics (34fb3d5). -->
    <script src="art/art-gen.js"></script>
    <script src="js/haptic.js"></script>
    <script src="js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator)
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("sw.js").catch(() => {})
        );
    </script>
  </body>
</html>
