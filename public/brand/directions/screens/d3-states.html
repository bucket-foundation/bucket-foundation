<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bkt Squiggle hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;800&family=Rubik:wght@500;700&display=block">
<style>:root{--bg:#FFF8E7;--surf:#FFFFFF;--text:#2B2B2B;--muted:#5E5A52;--acc:#6B367C;--onacc:#FFFFFF;--hl:#FF4B91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 16px/24px 'Nunito';font-optical-sizing:auto;-webkit-font-smoothing:antialiased}

.btn{background:var(--acc);color:var(--onacc);border:0;font:600 16px/1 'Nunito';padding:var(--s4) var(--s5);min-height:48px;cursor:pointer}.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--text)!important}
.study{padding:var(--s7) var(--s6)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4)}.c{background:var(--surf);padding:var(--s6);display:flex;flex-direction:column;gap:var(--s2)}.c p{margin:0}.tag{font-size:13px;font-weight:600;align-self:flex-start}.word{font:700 48px/56px 'Fredoka'}.tag{line-height:16px}.c p{line-height:24px}.muted{color:var(--muted)}.he,.he .word{font-family:'Rubik'}.he .tag{align-self:flex-start}.actions{display:flex;gap:var(--s4);justify-content:flex-end;align-items:center;margin-top:var(--s6)}.prog{flex:1;height:8px;background:color-mix(in srgb,var(--muted) 25%,transparent)}.prog i{display:block;height:100%;background:var(--acc)}

.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:var(--s7);align-items:center;align-content:start;padding:var(--s8) var(--s7)}.hero img{border-radius:24px;aspect-ratio:4/3;object-fit:cover}@media (max-width:600px){.hero img{aspect-ratio:1}}.btn{border-radius:16px;box-shadow:0 4px 0 #492457;text-transform:uppercase;font-weight:800;letter-spacing:.04em}.c{border-radius:16px;border:2px solid #E5E0D2;box-shadow:0 4px 0 #E5E0D2}.tag{background:#FF4B91;color:#1A1A1A;border-radius:8px;padding:2px var(--s2)}.root{background:#FFC800;border-color:#E0A800;box-shadow:0 4px 0 #E0A800}.root .muted{color:#3D3A33}.inp{font:400 16px/24px inherit;font-family:inherit;color:var(--text);background:var(--surf);border:1px solid var(--muted);padding:var(--s3) var(--s4);min-height:48px;width:220px;border-radius:inherit}.inp:focus-visible,.inp.is-focus{outline:3px solid var(--acc);outline-offset:2px}.inp:disabled,.inp.is-disabled{background:var(--bg);border-style:dashed;cursor:not-allowed}.btn{transition:background-color 120ms var(--ease),transform 80ms var(--ease),box-shadow 120ms}.btn:hover,.btn.is-hover{background:color-mix(in srgb,var(--acc) 86%,#000)}.btn:active,.btn.is-active{transform:translateY(1px)}.btn:focus-visible,.btn.is-focus{outline:3px solid var(--text);outline-offset:3px}.btn:disabled,.btn.is-disabled{background:var(--surf);color:var(--muted);box-shadow:inset 0 0 0 1px var(--muted);cursor:not-allowed;transform:none}.btn.ghost:hover,.btn.ghost.is-hover{background:color-mix(in srgb,var(--text) 10%,transparent)}:root{--ease:cubic-bezier(0.34,1.56,0.64,1);--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--s9:96px}
@media (max-width:600px){header{padding:var(--s3) var(--s4)}nav{display:none}.hero{display:flex!important;flex-direction:column;padding:var(--s6) var(--s4)!important;gap:var(--s5)}h1{font-size:37px}.study{padding:var(--s5) var(--s4)}.cards{grid-template-columns:1fr!important;gap:var(--s3)}.word{font-size:36px}.tree ol{grid-template-columns:1fr 1fr}footer{padding:var(--s4)}.actions{justify-content:stretch}.actions .btn{flex:1}}

</style></head><body style="min-height:0;display:block"><div style="display:flex;gap:16px;flex-wrap:wrap;padding:16px"><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn " >Start a streak</button><small style="color:var(--muted);font-size:12px;line-height:16px">default</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-hover" >Start a streak</button><small style="color:var(--muted);font-size:12px;line-height:16px">hover</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-active" >Start a streak</button><small style="color:var(--muted);font-size:12px;line-height:16px">active</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-focus" >Start a streak</button><small style="color:var(--muted);font-size:12px;line-height:16px">focus</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-disabled" disabled>Start a streak</button><small style="color:var(--muted);font-size:12px;line-height:16px">disabled</small></div><div style="display:flex;flex-direction:column;gap:4px"><input class="inp " value="entropy" aria-label="search" ><small style="color:var(--muted);font-size:12px;line-height:16px">input default</small></div><div style="display:flex;flex-direction:column;gap:4px"><input class="inp is-focus" value="Noether" aria-label="search" ><small style="color:var(--muted);font-size:12px;line-height:16px">input focus</small></div><div style="display:flex;flex-direction:column;gap:4px"><input class="inp is-disabled" value="" aria-label="search" disabled><small style="color:var(--muted);font-size:12px;line-height:16px">input disabled</small></div></div></body></html>
