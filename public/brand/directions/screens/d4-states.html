<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,600&family=Heebo:wght@500;800&display=block">
<style>:root{--bg:#141414;--surf:#222222;--text:#EFE6D2;--muted:#B5AC9A;--acc:#E3242B;--onacc:#FFFFFF;--hl:#EFE6D2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 16px/24px 'Roboto Flex';font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
