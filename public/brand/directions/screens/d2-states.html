<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bkt Kamon hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=Frank+Ruhl+Libre:wght@500;700&display=block">
<style>:root{--bg:#F4EFE4;--surf:#FBF8F1;--text:#1C1C1C;--muted:#5A5148;--acc:#1F3A5F;--onacc:#F4EFE4;--hl:#B8341B}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 16px/24px 'Zen Kaku Gothic New';font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
header{display:flex;justify-content:space-between;align-items:center;padding:var(--s4) var(--s6)}.logo{display:flex;gap:var(--s2);align-items:center;font:800 22px 'Shippori Mincho'}nav{display:flex;gap:var(--s5)}nav a{color:var(--text)}
h1{font:800 75px/1.15 'Shippori Mincho';letter-spacing:0.02em;margin:0 0 var(--s5)}.kicker{color:var(--muted);margin:0 0 var(--s4);font-size:14px}.sub{color:var(--muted);font-size:18px;line-height:28px;max-width:44ch;margin:0 0 var(--s6)}img{width:100%;display:block}.cons svg{width:100%;height:auto;display:block}img[hidden]{display:none}
.btn{background:var(--acc);color:var(--onacc);border:0;font:600 16px/1 'Zen Kaku Gothic New';padding:var(--s4) var(--s5);min-height:48px;cursor:pointer}.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--text)!important}
.study{padding:var(--s7) var(--s6)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4)}.c{background:var(--surf);padding:var(--s6);display:flex;flex-direction:column;gap:var(--s2)}.c p{margin:0}.tag{font-size:13px;font-weight:600;align-self:flex-start}.word{font:800 48px/56px 'Shippori Mincho'}.tag{line-height:16px}.c p{line-height:24px}.muted{color:var(--muted)}.he,.he .word{font-family:'Frank Ruhl Libre'}.he .tag{align-self:flex-start}.actions{display:flex;gap:var(--s4);justify-content:flex-end;align-items:center;margin-top:var(--s6)}.prog{flex:1;height:8px;background:color-mix(in srgb,var(--muted) 25%,transparent)}.prog i{display:block;height:100%;background:var(--acc)}
body{min-height:100vh;display:flex;flex-direction:column}main,.hero{flex:1}.tree{margin-top:var(--s6)}.tree h2{font:800 20px 'Shippori Mincho';margin:0 0 var(--s3)}.tree ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s3)}.tree li{border-top:2px solid var(--text);padding-top:var(--s2);display:flex;flex-direction:column}.tree b{font-size:20px}.tree span{color:var(--muted);font-size:14px}footer{padding:var(--s4) var(--s6);color:var(--muted);font-size:14px;border-top:1px solid color-mix(in srgb,var(--muted) 30%,transparent)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--s8) var(--s6)}.hero img{border-radius:20px;max-width:880px;aspect-ratio:21/9;object-fit:cover;margin-top:var(--s6)}.hero .sub{margin:0 auto var(--s5)}@media (max-width:600px){.hero img{aspect-ratio:4/5}}.btn{border-radius:999px}.c{border-radius:20px;border:1px solid #D9CFBE;text-align:center}.c .tag{align-self:center}.root{background:var(--acc);color:var(--onacc)}.root .muted{color:#D7DEE8}.seal{display:inline-block;background:var(--hl);color:#fff;border-radius:50%;width:44px;height:44px;line-height:44px;font-weight:700}.inp{font:400 16px/24px inherit;font-family:inherit;color:var(--text);background:var(--surf);border:1px solid var(--muted);padding:var(--s3) var(--s4);min-height:48px;width:220px;border-radius:inherit}.inp:focus-visible,.inp.is-focus{outline:3px solid var(--acc);outline-offset:2px}.inp:disabled,.inp.is-disabled{background:var(--bg);border-style:dashed;cursor:not-allowed}.btn{transition:background-color 120ms var(--ease),transform 80ms var(--ease),box-shadow 120ms}.btn:hover,.btn.is-hover{background:color-mix(in srgb,var(--acc) 86%,#000)}.btn:active,.btn.is-active{transform:translateY(1px)}.btn:focus-visible,.btn.is-focus{outline:3px solid var(--text);outline-offset:3px}.btn:disabled,.btn.is-disabled{background:var(--surf);color:var(--muted);box-shadow:inset 0 0 0 1px var(--muted);cursor:not-allowed;transform:none}.btn.ghost:hover,.btn.ghost.is-hover{background:color-mix(in srgb,var(--text) 10%,transparent)}:root{--ease:cubic-bezier(0.65,0,0.35,1);--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--s9:96px}
@media (max-width:600px){header{padding:var(--s3) var(--s4)}nav{display:none}.hero{display:flex!important;flex-direction:column;padding:var(--s6) var(--s4)!important;gap:var(--s5)}h1{font-size:42px}.study{padding:var(--s5) var(--s4)}.cards{grid-template-columns:1fr!important;gap:var(--s3)}.word{font-size:36px}.tree ol{grid-template-columns:1fr 1fr}footer{padding:var(--s4)}.actions{justify-content:stretch}.actions .btn{flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body style="min-height:0;display:block"><div style="display:flex;gap:16px;flex-wrap:wrap;padding:16px"><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn " >Begin a study</button><small style="color:var(--muted);font-size:12px;line-height:16px">default</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-hover" >Begin a study</button><small style="color:var(--muted);font-size:12px;line-height:16px">hover</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-active" >Begin a study</button><small style="color:var(--muted);font-size:12px;line-height:16px">active</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-focus" >Begin a study</button><small style="color:var(--muted);font-size:12px;line-height:16px">focus</small></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><button class="btn is-disabled" disabled>Begin a study</button><small style="color:var(--muted);font-size:12px;line-height:16px">disabled</small></div><div style="display:flex;flex-direction:column;gap:4px"><input class="inp " value="entropy" aria-label="search" ><small style="color:var(--muted);font-size:12px;line-height:16px">input default</small></div><div style="display:flex;flex-direction:column;gap:4px"><input class="inp is-focus" value="Noether" aria-label="search" ><small style="color:var(--muted);font-size:12px;line-height:16px">input focus</small></div><div style="display:flex;flex-direction:column;gap:4px"><input class="inp is-disabled" value="" aria-label="search" disabled><small style="color:var(--muted);font-size:12px;line-height:16px">input disabled</small></div></div></body></html>
