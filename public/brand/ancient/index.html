<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bucket Carved Stone</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=Noto+Naskh+Arabic:wght@700&family=Noto+Serif+Devanagari:wght@700&family=Noto+Serif+JP:wght@700&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
<style>
:root{--deep:#191816;--bone:#f4eddf;--patina:#7fd8cb;--gold:#f2bd47;--moss:#8fae62;--wrong:#d9694f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#3a342c,var(--deep) 62%);color:var(--bone);font:600 16px/1.45 Fredoka,sans-serif;min-height:100vh;overflow-x:hidden}
main{max-width:620px;margin:auto;padding:18px 16px 48px;display:grid;gap:20px}
.pebble{position:relative;overflow:hidden;isolation:isolate;border-radius:34px 42px 36px 44px/40px 34px 44px 36px;background:#655d51;box-shadow:inset 6px 7px 12px #ffffff40,inset -10px -13px 22px #000000a8,0 9px 0 #29251f,0 20px 28px #000b}
.pebble::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 28% 12%,#ffffff42,transparent 52%),radial-gradient(ellipse at 85% 100%,#0000008c,transparent 62%)}
.rock{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 20px}
.stat{display:flex;gap:7px;align-items:center;font-size:18px;text-shadow:0 2px 0 #0009}
.sun{width:30px;height:30px}
.lives{color:var(--wrong);letter-spacing:3px;font-size:20px;text-shadow:0 2px 0 #0009}
.channel{height:20px;padding:4px;border-radius:99px;background:#191715;box-shadow:inset 3px 4px 6px #000,inset -1px -1px 1px #fff3}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(#ffe08a,var(--gold) 45%,#a8761b);box-shadow:0 0 12px #f2bd4799;transition:width .4s cubic-bezier(.2,1.5,.5,1)}
.path{display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.node{width:42px;height:42px;display:grid;place-items:center;border-radius:48% 52% 46% 54%;color:#cfc6b6;background:radial-gradient(circle at 34% 26%,#958a7a,#5c5448 58%,#332e27);box-shadow:inset -3px -4px 6px #0009,0 4px 0 #1e1b17}
.node.done{color:#3b2905;background:radial-gradient(circle at 34% 26%,#ffe9a8,var(--gold) 52%,#a8761b)}
.node.now{outline:3px solid var(--patina);outline-offset:3px}
.card{padding:26px 24px 30px}
.label{margin:0;color:var(--patina);font:500 13px "IBM Plex Mono",monospace;text-shadow:0 1px 0 #000}
.word{margin:6px 0;font:700 clamp(60px,18vw,92px)/1.15 "Noto Serif","Noto Naskh Arabic","Noto Serif Devanagari","Noto Serif JP",serif;color:#100f0d;text-shadow:0 2px 1px #ffffff5c,0 -2px 2px #000c}
.gloss{margin:0;color:var(--bone);text-shadow:0 2px 0 #0009}
.options{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.stonebtn{appearance:none;border:0;min-height:84px;padding:10px;border-radius:17px 22px 15px 24px/20px 15px 24px 17px;cursor:pointer;font:600 18px Fredoka,sans-serif;color:var(--bone);text-shadow:0 2px 1px #000b;background:radial-gradient(ellipse at 34% 22%,#a79c8b,#756c5f 55%,#4a443b);box-shadow:inset 3px 4px 5px #ffffff50,inset -6px -8px 12px #0000009c,0 7px 0 #1f1c18,0 12px 12px #0008;transition:transform .08s,box-shadow .08s}
.stonebtn:nth-child(2n){border-radius:23px 15px 21px 16px/16px 22px 15px 23px}
.stonebtn:active{transform:translateY(6px);box-shadow:inset 3px 4px 7px #0006,inset -3px -4px 8px #0009,0 1px 0 #1f1c18}
.stonebtn:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.stonebtn.right{background:radial-gradient(ellipse at 34% 22%,#ffe9a8,var(--gold) 50%,#9b6c17);color:#3b2905;text-shadow:none}
.stonebtn.bad{background:radial-gradient(ellipse at 34% 22%,#e79b84,var(--wrong) 50%,#7a2c1d)}
.seal{position:absolute;right:18px;top:18px;width:78px;height:78px;display:grid;place-items:center;border-radius:50%;color:#3b2905;font-size:19px;background:radial-gradient(circle at 34% 26%,#ffe9a8,var(--gold) 55%,#9b6c17);box-shadow:inset -4px -5px 7px #0007,0 5px 0 #6d4b10;opacity:0;transform:scale(2) rotate(-18deg)}
.seal.on{opacity:1;transform:none;transition:transform .22s cubic-bezier(.3,1.6,.5,1),opacity .1s}
#result{min-height:24px;margin:16px 0 0;text-align:center;color:var(--gold);text-shadow:0 2px 0 #000a}
.moss{position:absolute;right:0;bottom:0;width:190px;height:96px;z-index:-1;opacity:.5;-webkit-mask-image:radial-gradient(ellipse at 100% 100%,#000 25%,transparent 72%);mask-image:radial-gradient(ellipse at 100% 100%,#000 25%,transparent 72%)}
@media (max-width:420px){.hud{grid-template-columns:auto auto;}.channel{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="stone" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".022 .032" numOctaves="5" seed="11"/><feDiffuseLighting surfaceScale="2.4" diffuseConstant=".9" lighting-color="#857c6e"><feDistantLight azimuth="225" elevation="56"/></feDiffuseLighting></filter>
<filter id="lichen"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="4" seed="3"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .64 0 0 0 0 .34 0 0 0 7 -3.7"/></filter></svg>
<main>
<section class="pebble hud">
<svg class="rock"><rect width="100%" height="100%" filter="url(#stone)"/></svg>
<div class="stat"><svg class="sun" viewBox="0 0 80 80" aria-hidden="true"><g fill="none" stroke="#f2bd47" stroke-width="6" stroke-linecap="round"><circle cx="40" cy="40" r="16"/><path d="M40 6v9M40 65v9M6 40h9M65 40h9M16 16l6 6M58 58l6 6M64 16l-6 6M22 58l-6 6"/></g></svg><span id="streak">7</span></div>
<div class="channel" aria-label="Experience"><div class="fill" id="fill"></div></div>
<div class="stat"><span class="lives" id="lives" aria-label="Lives">●●●</span><span id="xp">40 XP</span></div>
</section>
<nav class="path" id="path" aria-label="Lesson path"></nav>
<section class="pebble card">
<svg class="rock"><rect width="100%" height="100%" filter="url(#stone)"/></svg>
<div class="seal" id="seal">+10</div>
<p class="label" id="label"></p>
<div class="word" id="word"></div>
<p class="gloss">What does this word mean?</p>
<div class="options" id="options"></div>
<p id="result" aria-live="polite"></p>
<svg class="moss" aria-hidden="true"><rect width="100%" height="100%" filter="url(#lichen)"/></svg>
</section>
</main>
<script>
const rounds=[{l:"Japanese",lang:"ja",w:"水",a:"water",o:["water","fire","stone","sun"]},{l:"Greek",lang:"el",w:"λίθος",a:"stone",o:["moon","stone","river","bread"]},{l:"Arabic",lang:"ar",w:"شمس",a:"sun",o:["wind","salt","sun","tree"]},{l:"Hindi",lang:"hi",w:"ज्ञान",a:"knowledge",o:["knowledge","mother","road","rain"]}];
const $=i=>document.getElementById(i);let round=0,xp=40,lives=3,streak=7,locked=false;
function path(){$("path").innerHTML=rounds.map((r,i)=>`<div class="node ${i<round?"done":i===round?"now":""}">${i<round?"✓":i+1}</div>`).join("")}
function render(){const r=rounds[round];locked=false;path();$("label").textContent=r.l;$("word").textContent=r.w;$("word").lang=r.lang;$("result").textContent="";$("seal").classList.remove("on");$("fill").style.width=xp+"%";const box=$("options");box.innerHTML="";r.o.forEach(t=>{const b=document.createElement("button");b.className="stonebtn";b.textContent=t;b.onclick=()=>pick(b,t===r.a);box.append(b)})}
function pick(b,ok){if(locked)return;navigator.vibrate?.(ok?[12,30,18]:30);if(!ok){b.classList.add("bad");lives=Math.max(0,lives-1);$("lives").textContent="●".repeat(lives)+"○".repeat(3-lives);$("result").textContent="Try another stone.";b.disabled=true;return}locked=true;b.classList.add("right");xp=Math.min(100,xp+10);$("xp").textContent=xp+" XP";$("fill").style.width=xp+"%";$("seal").classList.add("on");$("result").textContent="Sealed.";setTimeout(()=>{round++;if(round<rounds.length)render();else{path();streak++;$("streak").textContent=streak;$("result").textContent="Lesson sealed. Streak "+streak+"."}},1100)}
render();
</script>
</body>
</html>
