---
# Postgres 16 + PostGIS + pgvector for bucket-foundation
# Namespace already exists (Nucleus instance lives here).
# Apply: kubectl apply -f postgres.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: bucket-foundation
type: Opaque
stringData:
  POSTGRES_USER: bucket
  POSTGRES_DB: bucket
  # Founder fills before apply:
  #   kubectl -n bucket-foundation create secret generic postgres-credentials \
  #     --from-literal=POSTGRES_USER=bucket \
  #     --from-literal=POSTGRES_DB=bucket \
  #     --from-literal=POSTGRES_PASSWORD='<strong-password>' \
  #     --dry-run=client -o yaml | kubectl apply -f -
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: bucket-foundation
data:
  00-postgis.sh: |
    #!/bin/bash
    # pgvector/pgvector:pg16 is Debian-based; install PostGIS matching pg16.
    # Runs once on first init (docker-entrypoint-initdb.d/).
    set -e
    apt-get update
    apt-get install -y --no-install-recommends postgresql-16-postgis-3 postgresql-16-postgis-3-scripts
    rm -rf /var/lib/apt/lists/*
  01-extensions.sql: |
    -- PostGIS for geospatial (USPTO assignee/inventor coords, future bucket geo features)
    CREATE EXTENSION IF NOT EXISTS postgis;
    CREATE EXTENSION IF NOT EXISTS postgis_topology;
    -- pgvector for embeddings (chat retrieval, semantic search over patents/canon)
    CREATE EXTENSION IF NOT EXISTS vector;
    -- Schema for USPTO patents ingest (see data/patents/uspto/schema/uspto.sql)
    CREATE SCHEMA IF NOT EXISTS patents;
    -- Schema for canon-tier artifacts (Bucket Foundation seven-branch canon)
    CREATE SCHEMA IF NOT EXISTS canon;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bucket-foundation
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bucket-foundation
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          # pgvector/pgvector:pg16 ships pgvector preinstalled.
          # PostGIS is added via the init script below using the postgres apt repo.
          # NOTE: switch to a custom image (postgis + pgvector baked in) once we want
          # to avoid runtime apt-install. For now this is fine for a single-node dev DB.
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bucket", "-d", "bucket"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "bucket", "-d", "bucket"]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-extensions.sql
              subPath: 01-extensions.sql
            - name: init
              mountPath: /docker-entrypoint-initdb.d/00-postgis.sh
              subPath: 00-postgis.sh
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
            items:
              - key: 01-extensions.sql
                path: 01-extensions.sql
              - key: 00-postgis.sh
                path: 00-postgis.sh
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
