---
# Postgres 16 + PostGIS + pgvector for bucket-foundation
# Namespace already exists (Nucleus instance lives here).
#
# REQUIRES: kubectl create secret generic postgres-credentials BEFORE applying this file.
# REQUIRES: agfarms/postgres-bucket:pg16-postgis-pgvector pushed to a registry the cluster can pull.
# See README.md for the one-time secret + image build commands.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: bucket-foundation
data:
  01-extensions.sql: |
    -- PostGIS for geospatial (USPTO assignee/inventor coords, future bucket geo features)
    CREATE EXTENSION IF NOT EXISTS postgis;
    CREATE EXTENSION IF NOT EXISTS postgis_topology;
    -- pgvector for embeddings (chat retrieval, semantic search over patents/canon)
    CREATE EXTENSION IF NOT EXISTS vector;
    -- Schema for USPTO patents ingest (see data/patents/uspto/schema/uspto.sql)
    CREATE SCHEMA IF NOT EXISTS patents;
    -- Schema for canon-tier artifacts (Bucket Foundation seven-branch canon)
    CREATE SCHEMA IF NOT EXISTS canon;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bucket-foundation
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bucket-foundation
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          # Baked image with postgis + pgvector preinstalled. Build once via
          # postgres-image/Dockerfile (see README.md). Avoids apt-install at
          # initdb (fragile on pod reschedule, network-dependent at boot).
          image: agfarms/postgres-bucket:pg16-postgis-pgvector
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bucket", "-d", "bucket"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "bucket", "-d", "bucket"]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-extensions.sql
              subPath: 01-extensions.sql
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
            items:
              - key: 01-extensions.sql
                path: 01-extensions.sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
