name: Bucket
options:
  bundleIdPrefix: foundation.bucket
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: QQ6D6A2LLS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  BucketKit:
    path: BucketKit
targets:
  Bucket:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Bucket/Sources
      - path: Bucket/Resources
      - path: Polingual/WidgetShared
      - path: Polingual/WatchShared
      - path: Shared/Corpus
        type: folder
        buildPhase: resources
    dependencies:
      - package: BucketKit
      - target: BucketWidgets
      - target: BucketWatch
        destinationFilters: [iOS]
      - target: BucketClip
        destinationFilters: [iOS]
    entitlements:
      path: Bucket/Bucket.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)foundation.bucket.shared
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.foundation.bucket.app
        com.apple.developer.associated-domains:
          - applinks:www.bucket.foundation
          - appclips:www.bucket.foundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: foundation.bucket.app
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Bucket/BucketMac.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BUCKET
        PRODUCT_NAME: Bucket
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Bucket
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: bucket.foundation
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Bucket listens when you tap Speak or the microphone, so you can practice a word or say a word or phrase to translate.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Bucket turns what you say into text to check your pronunciation or to translate the word or phrase you said. Most languages stay on your device; some are sent to Apple to recognize.
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
  BucketClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: Clip/Sources
      - path: Bucket/Sources/Style.swift
      - path: Bucket/Sources/Polingual/FlagArt.swift
      - path: Bucket/Sources/Polingual/D8Style.swift
      - path: Bucket/Resources/Assets.xcassets
    dependencies:
      - package: BucketKit
    info:
      path: Clip/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
    entitlements:
      path: Clip/BucketClip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)foundation.bucket.app
        com.apple.developer.associated-domains:
          - appclips:www.bucket.foundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: foundation.bucket.app.Clip
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BUCKET CLIP
        PRODUCT_NAME: BucketClip
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Bucket
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
  Polingual:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Polingual/Sources
      - path: Polingual/Resources
      - path: Shared/Corpus
        type: folder
        buildPhase: resources
      - path: Bucket/Sources/Polingual
      - path: Bucket/Sources/Style.swift
      - path: Bucket/Sources/AccountView.swift
      - path: Polingual/WidgetShared
      - path: Polingual/WatchShared
      - path: Polingual/Polingual.storekit
        buildPhase: none
    dependencies:
      - package: BucketKit
      - target: PolingualWidgets
      - target: PolingualWatch
        destinationFilters: [iOS]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Polingual/Polingual.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Polingual/PolingualMac.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.polingual.app
        PRODUCT_NAME: Polingual
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Polingual
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: polingual.com
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Polingual listens when you tap Speak or the microphone, so you can practice a word or say a word or phrase to translate.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Polingual turns what you say into text to check your pronunciation or to translate the word or phrase you said. Most languages stay on your device; some are sent to Apple to recognize.
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Polingual/PolingualDebug.entitlements
  BucketWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Polingual/Widget/PolingualWidget.swift
      - path: Bucket/Widget
        excludes:
          - Info.plist
          - Widget.entitlements
          - WidgetMac.entitlements
      - path: Polingual/WidgetShared
      - path: Bucket/Sources/Polingual/FlagArt.swift
    dependencies:
      - package: BucketKit
    info:
      path: Bucket/Widget/Info.plist
      properties:
        CFBundleDisplayName: Bucket
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Bucket/Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.foundation.bucket.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: foundation.bucket.app.widgets
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Bucket/Widget/WidgetMac.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BUCKET
        SKIP_INSTALL: YES
  PolingualWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Polingual/Widget
        excludes:
          - WidgetMac.entitlements
      - path: Polingual/WidgetShared
      - path: Bucket/Sources/Polingual/FlagArt.swift
    dependencies:
      - package: BucketKit
    info:
      path: Polingual/Widget/Info.plist
      properties:
        CFBundleDisplayName: Polingual
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Polingual/Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.polingual.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polingual.app.widgets
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Polingual/Widget/WidgetMac.entitlements
        MARKETING_VERSION: "1.0.1"
        SKIP_INSTALL: YES
  BucketWatch:
    type: application
    platform: watchOS
    sources:
      - path: Polingual/Watch/WatchApp.swift
      - path: Polingual/Watch/PrivacyInfo.xcprivacy
      - path: Bucket/Watch
      - path: Polingual/WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: foundation.bucket.app.watchkitapp
        PRODUCT_NAME: BucketWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bucket
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: foundation.bucket.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BUCKET
        SKIP_INSTALL: YES
  PolingualWatch:
    type: application
    platform: watchOS
    sources:
      - path: Polingual/Watch
      - path: Polingual/WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polingual.app.watchkitapp
        PRODUCT_NAME: PolingualWatch
        MARKETING_VERSION: "1.0.1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Polingual
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.polingual.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
  PolingualTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Polingual/Tests
      - path: Polingual/Polingual.storekit
        buildPhase: resources
    dependencies:
      - target: Polingual
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polingual.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bucket:
    build:
      targets:
        Bucket: all
    test:
      targets:
        - package: BucketKit/BucketKitTests
  Polingual:
    build:
      targets:
        Polingual: all
    run:
      config: Debug
      storeKitConfiguration: Polingual/Polingual.storekit
    test:
      config: Debug
      targets:
        - PolingualTests
