    path: bucket-canon/07-mind/information-foraging/primary-papers.yaml
    title: Information foraging.
    relation: The meta-analysis found that human-AI combination beats the better of the two alone on
      decision tasks but underperforms on content-creation tasks, with task decomposability, separable
      subcomponents each party can forage independently versus one unified output they must jointly
      produce, as the strongest moderator. Promotion pass two reads that moderator as an empirical test
      of the foundation record's cost-benefit account of information-seeking, extended from one forager
      to a two-agent team; a task that decomposes gives each party its own patch to forage, the condition
      under which the foundation record's model predicts a foraging benefit, and a task that does not
      decompose removes that benefit.
  provenance_signoff: 'pending: gianyrox'
