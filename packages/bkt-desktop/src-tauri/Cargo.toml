[package]
name = "bucket-desktop"
version = "0.4.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "bucket_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
url = "2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = false
